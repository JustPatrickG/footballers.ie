name: Build site

on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'build/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check the site builds
        run: python3 build/gen.py
