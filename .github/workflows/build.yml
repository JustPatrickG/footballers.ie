name: Build site

on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'build/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate site from data/
        run: |
          cd build
          python gen.py

      - name: Move generated pages to repo root
        run: |
          cp -r build/site/. ./
          rm -rf build/site

      - name: Commit if anything changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Rebuild site from data [skip ci]"
            git push
          fi
