name: live scores
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live
  cancel-in-progress: true

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python3 scraper/irish_scraper.py live
      - name: commit if changed
        run: |
          git config user.name "live-bot"
          git config user.email "actions@github.com"
          if ! git diff --quiet live.json 2>/dev/null; then
            git add live.json
            git commit -m "live update"
            git pull --rebase --autostash -X theirs || (git rebase --abort; git reset --hard origin/main; echo "lost the race, next run will catch up")
            git push
          else
            echo "no change"
          fi
