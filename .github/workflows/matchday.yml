name: matchday refresh
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-write
  cancel-in-progress: false

jobs:
  active:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: scrape players with a match in the last/next 36h
        run: python3 scraper/irish_scraper.py scrape --active
      - name: predicted / confirmed lineups
        run: python3 scraper/irish_scraper.py lineups
      - name: events and teamsheets for matches that just finished
        run: python3 scraper/irish_scraper.py events --days 3
      - name: commit if changed
        run: |
          git config user.name "scraper-bot"
          git config user.email "actions@github.com"
          git add data img scraper/fotmob_ids.csv scraper/last_xi.json scraper/match_index.json
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "matchday refresh"
            git pull --rebase --autostash -X theirs || (git rebase --abort; git reset --hard origin/main; echo "lost the race, next run will catch up")
            git push
          fi
