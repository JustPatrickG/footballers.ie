name: Sync roster from Wikidata

on:
  schedule:
    # 05:00 UTC every Monday — before you write the Monday newsletter
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Pull roster from Wikidata
        run: python build/fetch_roster.py || true

      # Same Wikidata trip, for the ~220 roster players with no headshot from
      # any source. Soft-failed: a bad week for the endpoint shouldn't fail
      # the roster sync.
      - name: Fill missing headshots from Wikidata
        run: python scraper/photo_fill.py || true

      - name: Commit if anything changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "Roster unchanged."
          else
            git commit -m "Sync roster from Wikidata [skip ci]"
            git push
          fi
