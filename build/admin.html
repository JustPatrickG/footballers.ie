<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>footballers.ie — admin</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0C0F10;--panel:#151A1B;--panel2:#181E1F;--line:#242B2C;--white:#EFF3F1;
      --mute:#77837F;--yellow:#F5C518;--teal:#35D4BF;--red:#FF5A48}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--white);font-family:'Space Grotesk',sans-serif;font-size:14px}
.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding:14px 20px}
.toprow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
h1{font-size:19px;font-weight:700}
h1 i{font-style:normal;color:var(--yellow)}
.badge{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  padding:4px 9px;border-radius:20px;border:1px solid var(--line);color:var(--mute)}
.badge.ok{border-color:rgba(53,212,191,.4);color:var(--teal)}
.spacer{flex:1}
button,.btn{background:var(--panel);border:1px solid var(--line);color:var(--white);padding:9px 14px;
  border-radius:7px;cursor:pointer;font-family:inherit;font-size:13px}
button:hover{background:var(--panel2)}
button.pri{background:var(--yellow);color:#0C0F10;border-color:var(--yellow);font-weight:700}
button:disabled{opacity:.4;cursor:not-allowed}
.tabs{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.tab{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  padding:8px 14px;border-radius:20px;border:1px solid var(--line);background:var(--panel);color:var(--mute)}
.tab.on{background:var(--yellow);color:#0C0F10;border-color:var(--yellow);font-weight:600}
.tab span{opacity:.7;margin-left:6px}
.wrap{padding:18px 20px 60px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
input,select,textarea{background:var(--panel);border:1px solid var(--line);color:var(--white);
  padding:9px 11px;border-radius:7px;font-family:inherit;font-size:13px}
input[type=search]{flex:1;min-width:180px}
textarea{width:100%;min-height:150px;font-family:'IBM Plex Mono',monospace;line-height:1.6}
.hint{color:var(--mute);font-size:12.5px;line-height:1.6;margin-bottom:12px}
.hint code{background:var(--panel);padding:2px 6px;border-radius:3px;color:var(--teal);font-family:'IBM Plex Mono',monospace}
.tblwrap{max-height:65vh;overflow:auto;border:1px solid var(--line);border-radius:8px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{position:sticky;top:0;background:var(--panel2);text-align:left;padding:9px 7px;white-space:nowrap;
  font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--mute);border-bottom:1px solid var(--line);z-index:2}
td{padding:2px 3px;border-bottom:1px solid #1B2122;vertical-align:top}
td input{width:100%;min-width:80px;padding:6px;font-size:12.5px;border-color:transparent;background:transparent}
td input:focus{border-color:var(--yellow);background:var(--bg);outline:none}
td.wide input{min-width:190px}
td.num input{min-width:56px;text-align:right;font-family:'IBM Plex Mono',monospace}
.rowdel{color:var(--red);background:none;border:0;font-size:16px;padding:0 8px;cursor:pointer}
.count{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--mute);padding:6px 0}
.panel{border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:18px;margin-bottom:16px}
.panel h2{font-size:12px;font-family:'IBM Plex Mono',monospace;letter-spacing:.14em;text-transform:uppercase;
  color:var(--yellow);margin-bottom:11px}
.note{font-family:'IBM Plex Mono',monospace;font-size:12px;margin-top:10px}
.ok{color:var(--teal)} .warn{color:var(--yellow)}
.artrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
label{display:block;font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--mute);margin-bottom:4px}
.artrow input{width:100%}
.artfull{margin-bottom:10px}
.artfull input{width:100%}
.artlist{display:grid;gap:8px;margin-bottom:16px}
.artitem{display:flex;gap:10px;align-items:center;background:var(--panel2);border:1px solid var(--line);
  border-radius:7px;padding:10px 12px;cursor:pointer}
.artitem:hover{border-color:var(--mute)}
.artitem .grip{cursor:grab;color:var(--mute);font-size:14px;letter-spacing:-3px;user-select:none}
.artitem.dragging{opacity:.4}
.artitem.over{border-color:var(--yellow);border-style:dashed}
.artitem.on{border-color:var(--yellow)}
.artitem b{font-size:13px}
.artitem small{color:var(--mute);font-family:'IBM Plex Mono',monospace;font-size:10px}
.deploy{font-family:'IBM Plex Mono',monospace;font-size:12px;background:var(--bg);border:1px solid var(--line);
  border-radius:7px;padding:12px;color:var(--teal);overflow-x:auto;white-space:pre;margin-top:8px}
@media(max-width:700px){ .artrow{grid-template-columns:1fr} }
</style>
</head>
<body>

<div class="top">
  <div class="toprow">
    <h1>irish<i>fball</i> admin</h1>
    <span class="badge" id="whoami"></span>
    <span class="badge" id="folderbadge">Loading…</span>
    <span class="spacer"></span>
    <button id="publish" class="pri">Publish changes</button>
    
    <button id="signout">Sign out</button>
  </div>
  <div class="tabs" id="tabs"></div>
</div>

<div class="wrap"><div id="view"></div></div>

<script>
/* gate: must have signed in via the site */
var SESSION=null;
(function(){
  try{ SESSION=JSON.parse(localStorage.getItem('fb_session_v1')||'null'); }catch(e){}
  if(!SESSION){
    document.body.innerHTML='<div style="min-height:100vh;display:grid;place-items:center;'+
      'font-family:Space Grotesk,sans-serif;color:#EFF3F1;text-align:center;padding:24px">'+
      '<div><div style="font-size:20px;font-weight:700;margin-bottom:10px">Not signed in</div>'+
      '<div style="color:#77837F;font-size:14px;line-height:1.6;max-width:36ch">Go to the site and '+
      'double-click the <b>footballers.ie</b> logo in the top left to sign in.</div>'+
      '<div style="margin-top:18px"><a href="../index.html" style="color:#F5C518;font-family:IBM Plex Mono,monospace;'+
      'font-size:12px;letter-spacing:.1em;text-transform:uppercase">← Back to site</a></div></div></div>';
    throw new Error('not signed in');
  }
})();

/* what each role can touch */
var ROLES = {
  owner:      {label:'Owner',      tabs:'*',                                          note:'Full access, including accounts.'},
  admin:      {label:'Admin',      tabs:['players','matches','articles','writers','fixtures','results','ireland','reports','subs'], note:'Everything except accounts.'},
  editor:     {label:'Editor',     tabs:['articles','writers','players','reports'],             note:'News, writers and player details.'},
  journalist: {label:'Journalist', tabs:['articles'],  ownOnly:true,                  note:'Write and edit your own articles.'},
  data:       {label:'Data',       tabs:['players','matches','fixtures','results','ireland'], note:'Stats and fixtures, no news.'},
  viewer:     {label:'Viewer',     tabs:'*', readOnly:true,                           note:'Can look, cannot change anything.'}
};
function role(){ return ROLES[(SESSION.role||'').toLowerCase()] || ROLES.viewer; }
function can(tab){ var r=role(); return r.tabs==='*' || r.tabs.indexOf(tab)>-1; }
function readOnly(){ return !!role().readOnly; }
function ownOnly(){ return !!role().ownOnly; }
</script>

<script>
const FILES = {
  players:  {path:'manual/players.csv',  ensure:['exclude'], label:'Players'},
  matches:  {path:'api/matches.csv',     label:'Matches'},
  articles: {path:'manual/articles.csv', ensure:['expires','use_player_photo','partner','partner_url'], label:'News'},
  writers:  {path:'manual/writers.csv', cols:['slug','name','bio','photo','links'], label:'Writers'},
  fixtures: {path:'manual/fixtures.csv', label:'Fixtures'},
  results:  {path:'manual/results.csv',  label:'Results'},
  ireland:  {path:'manual/ireland.csv',  label:'Ireland'},
  accounts: {path:'manual/accounts.csv', label:'Accounts'},
  reports:  {path:null, label:'Reports'},
  subs:     {path:null, label:'Signups'},
};
const WIDE=['name','club','league','headline','standfirst','author','born','eligible','youth','players','home','away','opponent','competition','image','photo','notes','body'];
const NUMS=['age','senior_caps','senior_goals','s_apps','s_starts','s_goals','s_assists','s_mins','s_yellow','s_red','c_apps','c_goals','c_assists','avg_rating','minutes','goals','assists','home_score','away_score','minute'];

const REPO={owner:'JustPatrickG', repo:'footballers.ie', branch:'main'};
let data={}, active='players', selectedArticle=0, shas={}, loaded=false;

function token(){ try{ return localStorage.getItem('fb_gh_token')||''; }catch(e){ return ''; } }
function setToken(t){ try{ localStorage.setItem('fb_gh_token',t); }catch(e){} }

function parseCSV(text){
  const rows=[]; let row=[], cur='', q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){
      if(c==='"'&&text[i+1]==='"'){cur+='"';i++;}
      else if(c==='"'){q=false;}
      else cur+=c;
    } else {
      if(c==='"') q=true;
      else if(c===','){row.push(cur);cur='';}
      else if(c==='\n'){row.push(cur);rows.push(row);row=[];cur='';}
      else if(c!=='\r') cur+=c;
    }
  }
  if(cur!==''||row.length){row.push(cur);rows.push(row);}
  if(!rows.length) return {cols:[],rows:[]};
  const cols=rows[0].map(s=>s.trim());
  const out=rows.slice(1).filter(r=>r.some(v=>(v||'').trim()))
    .map(r=>{const o={};cols.forEach((c,i)=>o[c]=(r[i]!==undefined?r[i]:''));return o;});
  return {cols,rows:out};
}
function toCSV(cols,rows){
  const esc=v=>{v=String(v==null?'':v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
  return [cols.join(',')].concat(rows.map(r=>cols.map(c=>esc(r[c])).join(','))).join('\n')+'\n';
}
function slugify(n){
  return (n||'').normalize('NFKD').replace(/[\u0300-\u036f]/g,'')
    .replace(/['\u2019]/g,'').replace(/[^a-zA-Z0-9]+/g,'-').replace(/^-|-$/g,'').toLowerCase();
}
function esc(v){ return String(v==null?'':v).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }

/* read the CSVs straight off the site — no folder picker */
async function loadAll(){
  const badge=document.getElementById('folderbadge');
  badge.textContent='Loading…'; badge.className='badge';
  let ok=0;
  for(const k of Object.keys(FILES)){
    if(!FILES[k].path){ data[k]={cols:[],rows:[],dirty:false}; continue; }
    try{
      const res=await fetch('../data/'+FILES[k].path+'?t='+Date.now());
      if(!res.ok) throw new Error(res.status);
      const p=parseCSV(await res.text());
      (FILES[k].ensure||[]).forEach(c=>{
        if(!p.cols.includes(c)){ p.cols.push(c); p.rows.forEach(r=>r[c]=r[c]||''); }
      });
      data[k]={...p, dirty:false};
      ok++;
    }catch(e){ data[k]={cols:(FILES[k].cols||[]).slice(),rows:[],dirty:false}; }
  }
  loaded=true;
  badge.textContent=`Loaded ${ok}/${Object.keys(FILES).filter(k=>FILES[k].path).length} files`;
  badge.className='badge ok';
  renderTabs(); render();
}

/* save = commit to GitHub, Vercel redeploys */
async function ghGet(path){
  const r=await fetch(`https://api.github.com/repos/${REPO.owner}/${REPO.repo}/contents/${path}?ref=${REPO.branch}`,
    {headers:{Authorization:'token '+token(), Accept:'application/vnd.github+json'}});
  if(r.status===404) return null;
  if(!r.ok) throw new Error('GitHub read failed ('+r.status+')');
  return r.json();
}
async function ghPut(path, text, sha){
  const body={message:'Update '+path+' via admin', branch:REPO.branch,
              content:btoa(unescape(encodeURIComponent(text)))};
  if(sha) body.sha=sha;
  const r=await fetch(`https://api.github.com/repos/${REPO.owner}/${REPO.repo}/contents/${path}`,
    {method:'PUT', headers:{Authorization:'token '+token(), Accept:'application/vnd.github+json',
     'Content-Type':'application/json'}, body:JSON.stringify(body)});
  if(!r.ok){
    const detail = await r.text().catch(()=> '');
    const err = new Error('GitHub write failed ('+r.status+')');
    err.status = r.status; err.detail = detail;
    throw err;
  }
  return r.json();
}

/* 409 means the file moved on since we loaded it — refetch and retry */
async function ghSave(path, text){
  for(let attempt=0; attempt<3; attempt++){
    try{
      const cur = await ghGet(path);
      return await ghPut(path, text, cur && cur.sha);
    }catch(e){
      if(e.status===409 && attempt<2){ await new Promise(r=>setTimeout(r, 700)); continue; }
      throw e;
    }
  }
}

async function saveAll(){
  const badge=document.getElementById('folderbadge');
  if(!token()){ askToken(); return; }
  const dirty=Object.keys(FILES).filter(k=>FILES[k].path&&data[k]&&data[k].dirty&&data[k].cols.length);
  if(!dirty.length){ badge.textContent='Nothing changed'; badge.className='badge'; return; }
  badge.textContent='Publishing…'; badge.className='badge';
  try{
    for(const k of dirty){
      const path='data/'+FILES[k].path;
      await ghSave(path, toCSV(data[k].cols, data[k].rows));
      data[k].dirty=false;
    }
    badge.textContent='Published · site rebuilding'; badge.className='badge ok';
    renderTabs();
  }catch(e){
    badge.textContent=String(e.message||e); badge.className='badge';
    var hint = e.status===409
      ? 'The file changed on the server while you were editing.\nReload the admin and make the change again.'
      : e.status===401 || e.status===403
        ? 'Your GitHub token needs "repo" scope, or it has expired.'
        : (e.detail || '').slice(0,200);
    alert(e.message + (hint ? '\n\n' + hint : ''));
  }
}

function askToken(){
  const t=prompt('Paste a GitHub personal access token with "repo" scope.\n'+
                 'Create one at github.com/settings/tokens\n\n'+
                 'Stored only in this browser.');
  if(t){ setToken(t.trim()); saveAll(); }
}

function renderTabs(){
  const who=document.getElementById('whoami');
  if(who){ who.textContent=(SESSION.name||SESSION.email)+' · '+role().label; who.className='badge ok'; }
  const t=document.getElementById('tabs'); t.innerHTML='';
  Object.keys(FILES).forEach(k=>{
    if(k==='accounts' && (SESSION.role||'').toLowerCase()!=='owner') return;
    if(!can(k)) return;
    const b=document.createElement('button');
    b.className='tab'+(k===active?' on':'');
    const n=data[k]?data[k].rows.length:0;
    b.innerHTML=FILES[k].label+'<span>'+n+(data[k]&&data[k].dirty?' •':'')+'</span>';
    b.onclick=()=>{active=k;selectedArticle=0;renderTabs();render();};
    t.appendChild(b);
  });
}
function markDirty(){ data[active].dirty=true; renderTabs(); }

function tableView(){
  const d=data[active];
  if(!d.cols.length) return `<div class="panel"><h2>${FILES[active].label}</h2>
    <div class="hint">Couldn't find <code>data/${FILES[active].path}</code>.</div></div>`;
  const v=document.createElement('div');
  v.innerHTML=`
    <div class="bar">
      <input type="search" id="q" placeholder="Search…">
      <button id="addrow">+ Add row</button>
      ${active==='players'?'<button id="bulk">Bulk add</button><button id="hidep">Hide a player</button>':''}
      <span class="count" id="count"></span>
    </div>
    <div id="bulkbox"></div>
    <div class="tblwrap"><table><thead><tr>${d.cols.map(c=>`<th>${c}</th>`).join('')}<th></th></tr></thead>
    <tbody id="tb"></tbody></table></div>`;
  setTimeout(()=>{
    const q=v.querySelector('#q'), tb=v.querySelector('#tb');
    function draw(){
      const term=(q.value||'').toLowerCase();
      tb.innerHTML=''; let shown=0;
      d.rows.forEach((r,i)=>{
        if(term && !Object.values(r).join(' ').toLowerCase().includes(term)) return;
        shown++;
        const tr=document.createElement('tr');
        d.cols.forEach(c=>{
          const td=document.createElement('td');
          td.className=NUMS.includes(c)?'num':(WIDE.includes(c)?'wide':'');
          const inp=document.createElement('input');
          if(c==='exclude'){
            /* "not a player" — managers and anyone the feed lists wrongly.
               Ticked rows are dropped from the site entirely. */
            inp.type='checkbox'; inp.title='Not a player — hide from the site';
            inp.checked=/^(y|yes|true|1)$/i.test(r[c]||'');
            if(readOnly()) inp.disabled=true;
            inp.onchange=()=>{ r[c]=inp.checked?'yes':''; markDirty(); };
          } else {
            inp.value=r[c]||'';
            if(readOnly()) inp.readOnly=true;
            inp.oninput=()=>{ r[c]=inp.value;
              if(c==='name'&&'slug' in r&&!r.slug) r.slug=slugify(inp.value);
              markDirty(); };
          }
          td.appendChild(inp); tr.appendChild(td);
        });
        const td=document.createElement('td');
        const del=document.createElement('button');
        del.className='rowdel'; del.textContent='×';
        del.onclick=()=>{ if(confirm('Delete this row?')){ d.rows.splice(i,1); markDirty(); draw(); } };
        td.appendChild(del); tr.appendChild(td); tb.appendChild(tr);
      });
      v.querySelector('#count').textContent=`${shown} shown · ${d.rows.length} total`;
    }
    q.oninput=draw;
    v.querySelector('#addrow').onclick=()=>{
      const o={}; d.cols.forEach(c=>o[c]=''); d.rows.unshift(o); markDirty(); draw();
    };
    const hidep=v.querySelector('#hidep');
    if(hidep) hidep.onclick=()=>{
      /* The scraper takes the whole squad page, which on FotMob includes the
         manager. This writes a manual row that hides them everywhere. */
      const n=prompt('Name of the person to hide (e.g. a manager listed as a player):');
      if(!n) return;
      const slug=slugify(n); if(!slug) return;
      let row=d.rows.find(r=>r.slug===slug);
      if(!row){ row={}; d.cols.forEach(c=>row[c]=''); row.slug=slug; row.name=n.trim(); d.rows.unshift(row); }
      row.exclude='yes'; markDirty(); q.value=slug; draw();
      alert(n.trim()+' will be hidden on the next build. Save to publish.');
    };
    const bulk=v.querySelector('#bulk');
    if(bulk) bulk.onclick=()=>{
      const box=v.querySelector('#bulkbox');
      if(box.innerHTML){ box.innerHTML=''; return; }
      box.innerHTML=`<div class="panel"><h2>Bulk add players</h2>
        <div class="hint">One per line: <code>Name, Club</code> or <code>Name, Club, POS, League</code>.</div>
        <textarea id="bt" placeholder="Cathal McCarthy, Hull City, MID, Championship"></textarea>
        <div class="bar" style="margin-top:10px"><button class="pri" id="bgo">Add</button></div>
        <div class="note" id="bn"></div></div>`;
      box.querySelector('#bgo').onclick=()=>{
        let added=0,skipped=0;
        box.querySelector('#bt').value.split(/\r?\n/).forEach(l=>{
          l=l.trim(); if(!l||l.startsWith('#'))return;
          const p=l.split(',').map(s=>s.trim());
          const slug=slugify(p[0]); if(!slug)return;
          if(d.rows.some(r=>r.slug===slug)){skipped++;return;}
          const o={}; d.cols.forEach(c=>o[c]='');
          o.slug=slug; o.name=p[0]; o.club=p[1]||''; o.pos=p[2]||''; o.league=p[3]||'';
          o.tier=/league of ireland|loi/i.test(o.league)?'loi':'abroad-lower';
          if('cap_status' in o) o.cap_status='uncapped';
          if('eligible' in o) o.eligible='Republic of Ireland:eligible';
          d.rows.unshift(o); added++;
        });
        box.querySelector('#bn').innerHTML=`<span class="ok">Added ${added}.</span>`+(skipped?` <span class="warn">${skipped} already there.</span>`:'');
        markDirty(); draw();
      };
    };
    draw();
  },0);
  return v;
}

function myArticles(d){
  if(!ownOnly()) return d.rows.map((r,i)=>({r,i}));
  const me=(SESSION.name||'').toLowerCase(), em=(SESSION.email||'').toLowerCase();
  return d.rows.map((r,i)=>({r,i})).filter(x=>{
    const a=(x.r.author||'').toLowerCase();
    return a===me || a===em || !a;
  });
}
let selectedWriter=0;
function writersView(){
  const d=data.writers; if(!d.cols.length) d.cols=['slug','name','bio','photo','links'];
  if(!d.rows.length) selectedWriter=-1; else if(selectedWriter<0||selectedWriter>=d.rows.length) selectedWriter=0;
  const w=selectedWriter>-1?d.rows[selectedWriter]:null;
  const wrap=document.createElement('div');
  wrap.innerHTML=`<div class="panel"><h2>Writers <span class="hint">${d.rows.length} on file · these are the profiles readers see under News</span></h2>
    <div class="artlist">${d.rows.map((x,i)=>`<div class="artitem${i===selectedWriter?' on':''}" data-i="${i}">
      <div style="display:flex;align-items:center;gap:10px">${x.photo?`<img src="${esc(x.photo.startsWith('http')?x.photo:'../'+x.photo)}" style="width:32px;height:32px;border-radius:50%;object-fit:cover">`:`<span style="width:32px;height:32px;border-radius:50%;background:#222;display:inline-flex;align-items:center;justify-content:center;font-size:11px">${esc((x.name||'?').split(' ').map(p=>p[0]).join('').slice(0,2).toUpperCase())}</span>`}
      <div><b>${esc(x.name)||'(unnamed)'}</b><br><small class="hint">${(data.articles?data.articles.rows:[]).filter(a=>(a.author||'').toLowerCase()===(x.name||'').toLowerCase()).length} articles</small></div></div>
      <button class="btn sm danger" data-wdel="${i}">Delete</button></div>`).join('')||'<div class="hint">No writers yet. Add one, or press + New beside the author field when writing an article.</div>'}</div>
    <button class="btn" id="w_add" style="margin-top:10px">+ Add writer</button></div>
    ${w?`<div class="panel"><h2>Edit writer</h2>
      <div class="artrow"><div><label>Name</label><input id="w_name" value="${esc(w.name)}"></div>
        <div><label>Profile URL slug</label><input id="w_slug" value="${esc(w.slug)}" placeholder="auto from name"></div></div>
      <div class="artrow"><div><label>Photo (path in repo, e.g. img/writers/name.jpg — or a full URL)</label><input id="w_photo" value="${esc(w.photo||'')}"></div>
        <div><label>Preview</label><div style="padding-top:6px">${w.photo?`<img src="${esc(w.photo.startsWith('http')?w.photo:'../'+w.photo)}" style="width:56px;height:56px;border-radius:50%;object-fit:cover">`:'<span class="hint">none</span>'}</div></div></div>
      <div><label>Bio (a paragraph or two)</label><textarea id="w_bio" rows="5">${esc(w.bio||'')}</textarea></div>
      <div><label>Links — one per line as <code>Label | https://…</code> (e.g. Substack | https://…, X | https://x.com/…)</label><textarea id="w_links" rows="4">${esc((w.links||'').split(';').filter(Boolean).join('\n'))}</textarea></div>
      <div class="hint" style="margin-top:8px">Changes save when you Publish. Articles are matched to writers by name, so keep the name exactly as it appears on the byline.</div>
    </div>`:''}`;
  wrap.querySelectorAll('.artitem').forEach(el=>{ el.onclick=e=>{ if(e.target.dataset.wdel!==undefined) return; selectedWriter=+el.dataset.i; render(); }; });
  wrap.querySelectorAll('[data-wdel]').forEach(b=>{ b.onclick=e=>{ e.stopPropagation(); if(!confirm('Delete this writer profile? Their articles stay.')) return; d.rows.splice(+b.dataset.wdel,1); d.dirty=true; selectedWriter=0; renderTabs(); render(); }; });
  const add=wrap.querySelector('#w_add'); if(add) add.onclick=()=>{ d.rows.push({slug:'',name:'',bio:'',photo:'',links:''}); d.dirty=true; selectedWriter=d.rows.length-1; renderTabs(); render(); };
  if(w){
    const bind=(id,f,fn)=>{ const el=wrap.querySelector('#'+id); if(!el) return; el.oninput=()=>{ w[f]=fn?fn(el.value):el.value; if(f==='name'&&!w.slug) w.slug=el.value.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,''); d.dirty=true; renderTabs(); }; };
    bind('w_name','name'); bind('w_slug','slug'); bind('w_photo','photo'); bind('w_bio','bio');
    bind('w_links','links',v=>v.split('\n').map(x=>x.trim()).filter(Boolean).join(';'));
  }
  return wrap;
}
function articleView(){
  const d=data.articles;
  if(!d.cols.length) return `<div class="panel"><h2>News</h2><div class="hint">No articles.csv found.</div></div>`;
  const v=document.createElement('div');
  const a=d.rows[selectedArticle]||{};
  v.innerHTML=`
    <div class="bar"><button id="newart" class="pri">+ New article</button>
      <span class="count">${myArticles(d).length} article${myArticles(d).length===1?"":"s"}</span></div>
    <div class="hint" style="margin-bottom:8px">Drag to reorder — top article leads the homepage carousel and the news page.</div>
    <div class="artlist" id="artlist">${myArticles(d).map(({r:x,i})=>`<div class="artitem${i===selectedArticle?' on':''}" data-i="${i}" draggable="true">
      <span class="grip" title="Drag">⋮⋮</span>
      <div style="flex:1"><b>${esc(x.headline)||'(untitled)'}</b><br>
      <small>${esc(x.date)} · ${esc(x.tag)} · ${esc(x.author)}</small></div>
      <button class="rowdel" data-del="${i}">×</button></div>`).join('')}</div>
    <div class="panel"><h2>Edit article</h2>
      <div class="artfull"><label>Headline</label><input id="f_headline" value="${esc(a.headline)}"></div>
      <div class="artfull"><label>Standfirst</label><input id="f_standfirst" value="${esc(a.standfirst)}"></div>
      <div class="artrow">
        <div><label>Date (YYYY-MM-DD)</label><input id="f_date" value="${esc(a.date)}"></div>
        <div><label>Tag</label><input id="f_tag" value="${esc(a.tag)}"></div></div>
      <div class="artrow">
        <div><label>Author</label><div style="display:flex;gap:6px"><input id="f_author" list="writers_dl" value="${esc(a.author)}" placeholder="Start typing a name…" style="flex:1"><button type="button" class="btn sm" id="f_author_new" title="Add a new writer">+ New</button></div>
          <datalist id="writers_dl">${(data.writers?data.writers.rows:[]).map(w=>`<option value="${esc(w.name)}">`).join('')}</datalist></div>
        <div><label>Player slug (optional)</label><input id="f_player_slug" value="${esc(a.player_slug)}"></div></div>
      <div class="frow">
        <div><label>Expires (optional — drops out of the homepage carousel after this; stays on the news page)</label>
          <input id="f_expires" type="datetime-local" value="${esc(a.expires||'')}"></div>
        <div><label>Tip</label><div class="hint" style="padding-top:9px">Tag an article <b>NOW</b>, <b>LIVE</b> or <b>BREAKING</b> and it pins first in the carousel with a red "Happening now" treatment. Set it to expire when the moment's over.</div></div></div>
      <div class="artrow">
        <div><label>Slug (URL)</label><input id="f_slug" value="${esc(a.slug)}"></div>
        <div><label>Image path (optional)</label><input id="f_image" value="${esc(a.image)}" placeholder="images/file.jpg or https://…"></div></div>
      <div class="artrow">
        <div><label>Use player's photo as the image</label><select id="f_use_player_photo"><option value="">No (default — plain card)</option><option value="yes" ${a.use_player_photo==='yes'?'selected':''}>Yes — needs a player slug</option></select></div>
        <div><label>Also published at (optional — e.g. "Touchline Studios", "The 42")</label><input id="f_partner" value="${esc(a.partner||'')}" placeholder="Publication or newsletter name"></div></div>
      <div class="artrow">
        <div><label>Link to the original (optional)</label><input id="f_partner_url" value="${esc(a.partner_url||'')}" placeholder="https://…"></div>
        <div><label>Tip</label><div class="hint" style="padding-top:9px">If you fill these in, the article ends with an "Also published at …" box linking out, instead of "More news". Works for any writer.</div></div></div>
      <div class="artfull"><label>Body — blank line between paragraphs</label>
        <textarea id="f_body"></textarea></div>
    </div>`;
  setTimeout(()=>{
    const ta=v.querySelector('#f_body');
    if(ta) ta.value=String(a.body||'').split('\\n').join('\n');
    v.querySelectorAll('.artitem').forEach(el=>{
      el.onclick=e=>{ if(e.target.dataset.del!==undefined) return;
        selectedArticle=+el.dataset.i; render(); };
      el.ondragstart=e=>{ e.dataTransfer.setData('text/plain', el.dataset.i); el.classList.add('dragging'); };
      el.ondragend=()=>el.classList.remove('dragging');
      el.ondragover=e=>{ e.preventDefault(); el.classList.add('over'); };
      el.ondragleave=()=>el.classList.remove('over');
      el.ondrop=e=>{ e.preventDefault(); el.classList.remove('over');
        const from=+e.dataTransfer.getData('text/plain'), to=+el.dataset.i;
        if(from===to||isNaN(from)) return;
        const row=d.rows.splice(from,1)[0]; d.rows.splice(to,0,row);
        selectedArticle=to; markDirty(); render(); };
    });
    v.querySelectorAll('[data-del]').forEach(b=>{
      b.onclick=e=>{ e.stopPropagation();
        if(confirm('Delete this article?')){ d.rows.splice(+b.dataset.del,1); selectedArticle=0; markDirty(); render(); } };
    });
    v.querySelector('#newart').onclick=()=>{
      const o={}; d.cols.forEach(c=>o[c]='');
      o.date=new Date().toISOString().slice(0,10); o.author=SESSION.name||'footballers.ie Staff';
      d.rows.unshift(o); selectedArticle=0; markDirty(); render();
    };
    ['headline','standfirst','date','tag','author','player_slug','slug','image','body','expires','use_player_photo','partner','partner_url'].forEach(f=>{
      const el=v.querySelector('#f_'+f); if(!el) return;
      el.oninput=el.onchange=()=>{
        const row=d.rows[selectedArticle]; if(!row) return;
        row[f] = f==='body' ? el.value.split('\n').join('\\n') : el.value;
        if(f==='headline' && !row.slug) row.slug=slugify(el.value);
        markDirty();
      };
    });
  },0);
  return v;
}

async function sha256(s){
  if(window.crypto&&crypto.subtle&&window.isSecureContext){
    const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));
    return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('');
  }
  return null;
}
function accountsExtra(){
  const p=document.createElement('div');
  p.className='panel';
  p.innerHTML=`<h2>Add someone / set a password</h2>
    <div class="hint">Type their email and a password — the hash is generated for you and the row
    is created or updated. Then hit <b>Publish changes</b>.<br>
    Roles: <code>owner</code> · <code>admin</code> · <code>editor</code> · <code>journalist</code> ·
    <code>data</code> · <code>viewer</code></div>
    <div class="artrow">
      <div><label>Email</label><input id="pw_email" placeholder="writer@footballers.ie"></div>
      <div><label>Name</label><input id="pw_name" placeholder="Their name"></div>
    </div>
    <div class="artrow">
      <div><label>Password</label><input id="pw_pass" type="text" placeholder="something long"></div>
      <div><label>Role</label>
        <select id="pw_role">
          <option value="journalist">journalist</option>
          <option value="editor">editor</option>
          <option value="data">data</option>
          <option value="admin">admin</option>
          <option value="viewer">viewer</option>
          <option value="owner">owner</option>
        </select></div>
    </div>
    <div class="bar"><button class="pri" id="pw_go">Set password</button></div>
    <div class="note" id="pw_note"></div>`;
  setTimeout(()=>{
    p.querySelector('#pw_go').onclick=async()=>{
      const em=(p.querySelector('#pw_email').value||'').trim().toLowerCase();
      const pwv=p.querySelector('#pw_pass').value;
      const nmv=(p.querySelector('#pw_name').value||'').trim();
      const rl=p.querySelector('#pw_role').value;
      const note=p.querySelector('#pw_note');
      if(!em||!pwv){ note.innerHTML='<span class="warn">Fill in email and password.</span>'; return; }
      const h=await sha256(em+':'+pwv);
      if(!h){ note.innerHTML='<span class="warn">Open the admin over https to hash passwords.</span>'; return; }
      const d=data.accounts;
      let row=d.rows.find(r=>(r.email||'').toLowerCase()===em);
      const isNew=!row;
      if(isNew){ row={}; d.cols.forEach(c=>row[c]=''); row.email=em; d.rows.push(row); }
      row.hash=h;
      if(nmv) row.name=nmv;
      if(rl)  row.role=rl;
      markDirty(); render();
      const n2=document.getElementById('pw_note');
      if(n2) n2.innerHTML='<span class="ok">'+(isNew?'Added ':'Updated ')+em+
        ' — now hit Publish changes.</span>';
    };
  },0);
  return p;
}

function publishNote(){
  const p=document.createElement('div');
  p.className='panel';
  p.innerHTML=`<h2>Publishing</h2>
    <div class="hint">Edit anything above, then hit <b>Publish changes</b>. It commits straight to
    the site and rebuilds automatically — no terminal, no files.</div>
    <div class="bar"><button id="chtok">Change GitHub token</button></div>`;
  setTimeout(()=>{p.querySelector('#chtok').onclick=()=>{
    try{ localStorage.removeItem('fb_gh_token'); }catch(e){}
    askToken();
  };},0);

}

async function reportsView(){
  const v=document.createElement('div');
  v.innerHTML=`<div class="bar"><button id="refr">Refresh</button>
    <span class="count" id="rcount">Loading reports…</span></div>
    <div id="rlist"></div>`;
  async function load(){
    const list=v.querySelector('#rlist'), cnt=v.querySelector('#rcount');
    if(!token()){
      cnt.textContent='';
      list.innerHTML='<div class="panel"><h2>Not connected</h2><div class="hint">'+
        'Reports are stored as GitHub issues. Add your token to read them.</div>'+
        '<div class="bar"><button class="pri" id="tk">Add token</button></div></div>';
      list.querySelector('#tk').onclick=askToken;
      return;
    }
    try{
      const r=await fetch(`https://api.github.com/repos/${REPO.owner}/${REPO.repo}/issues?state=open&labels=report&per_page=50`,
        {headers:{Authorization:'token '+token(), Accept:'application/vnd.github+json'}});
      if(!r.ok) throw new Error('GitHub said '+r.status);
      const issues=await r.json();
      cnt.textContent=issues.length+' open';
      if(!issues.length){ list.innerHTML='<div class="panel"><div class="hint">No open reports. </div></div>'; return; }
      list.innerHTML=issues.map(i=>{
        const labels=(i.labels||[]).map(l=>typeof l==='string'?l:l.name).filter(n=>n!=='report');
        return `<div class="panel" style="margin-bottom:10px">
          <div style="display:flex;justify-content:space-between;gap:12px;align-items:baseline">
            <b style="font-size:15px">${esc(i.title)}</b>
            <span class="count">#${i.number}</span></div>
          <div class="hint" style="white-space:pre-wrap;margin:9px 0 10px">${esc(i.body||'')}</div>
          <div class="bar">
            ${labels.map(l=>`<span class="badge">${esc(l)}</span>`).join('')}
            <span class="spacer"></span>
            <a class="btn" href="${i.html_url}" target="_blank" rel="noopener">Open</a>
            <button data-close="${i.number}">Mark done</button>
          </div></div>`;
      }).join('');
      list.querySelectorAll('[data-close]').forEach(b=>{
        b.onclick=async()=>{
          b.disabled=true; b.textContent='Closing…';
          try{
            await fetch(`https://api.github.com/repos/${REPO.owner}/${REPO.repo}/issues/${b.dataset.close}`,
              {method:'PATCH', headers:{Authorization:'token '+token(),
               Accept:'application/vnd.github+json','Content-Type':'application/json'},
               body:JSON.stringify({state:'closed'})});
            load();
          }catch(e){ b.disabled=false; b.textContent='Mark done'; }
        };
      });
    }catch(e){
      cnt.textContent='';
      list.innerHTML='<div class="panel"><div class="hint">Could not load reports: '+esc(e.message)+'</div></div>';
    }
  }
  setTimeout(()=>{ v.querySelector('#refr').onclick=load; load(); },0);
  return v;
}

async function subsView(){
  const v=document.createElement('div');
  v.innerHTML=`<div class="bar"><button id="refr">Refresh</button>
    <button id="dl">Download CSV</button>
    <span class="count" id="scount">Loading…</span></div><div id="slist"></div>`;
  let rows=[];
  async function load(){
    const list=v.querySelector('#slist'), cnt=v.querySelector('#scount');
    const repo=(window.SUBS_REPO||'');
    if(!token()){
      cnt.textContent='';
      list.innerHTML='<div class="panel"><h2>Not connected</h2><div class="hint">'+
        'Add your GitHub token to read signups.</div>'+
        '<div class="bar"><button class="pri" id="tk">Add token</button></div></div>';
      list.querySelector('#tk').onclick=askToken; return;
    }
    if(!repo){
      cnt.textContent='';
      list.innerHTML='<div class="panel"><h2>Not configured</h2><div class="hint">'+
        'Set <code>SUBSCRIBERS_REPO</code> in Vercel to a <b>private</b> repository, then add '+
        'the same value here so the admin knows where to look.</div>'+
        '<div class="bar"><button class="pri" id="sr">Set repo</button></div></div>';
      list.querySelector('#sr').onclick=()=>{
        const r=prompt('Private repo holding subscribers.csv (owner/name):');
        if(r){ try{ localStorage.setItem('fb_subs_repo', r.trim()); }catch(e){} window.SUBS_REPO=r.trim(); load(); }
      };
      return;
    }
    try{
      const r=await fetch(`https://api.github.com/repos/${repo}/contents/subscribers.csv`,
        {headers:{Authorization:'token '+token(), Accept:'application/vnd.github+json'}});
      if(r.status===404){ cnt.textContent='0'; list.innerHTML='<div class="panel"><div class="hint">No signups yet.</div></div>'; return; }
      if(!r.ok) throw new Error('GitHub said '+r.status);
      const j=await r.json();
      const text=decodeURIComponent(escape(atob(j.content.replace(/\n/g,''))));
      const parsed=parseCSV(text); rows=parsed.rows;
      cnt.textContent=rows.length+' signups';
      list.innerHTML='<div class="tblwrap"><table><thead><tr>'+
        parsed.cols.map(c=>`<th>${c}</th>`).join('')+'</tr></thead><tbody>'+
        rows.slice().reverse().map(x=>'<tr>'+parsed.cols.map(c=>
          `<td style="padding:9px 7px">${esc(x[c]||'')}</td>`).join('')+'</tr>').join('')+
        '</tbody></table></div>';
    }catch(e){
      cnt.textContent='';
      list.innerHTML='<div class="panel"><div class="hint">Could not load signups: '+esc(e.message)+'</div></div>';
    }
  }
  setTimeout(()=>{
    v.querySelector('#refr').onclick=load;
    v.querySelector('#dl').onclick=()=>{
      if(!rows.length) return;
      const cols=Object.keys(rows[0]);
      const csv=[cols.join(',')].concat(rows.map(r=>cols.map(c=>{
        const s=String(r[c]==null?'':r[c]);
        return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;}).join(','))).join('\n');
      const a=document.createElement('a');
      a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
      a.download='subscribers.csv'; a.click();
    };
    try{ window.SUBS_REPO = localStorage.getItem('fb_subs_repo')||''; }catch(e){}
    load();
  },0);
  return v;
}

function render(){
  const v=document.getElementById('view'); v.innerHTML='';
  if(!loaded){ v.innerHTML='<div class="panel"><h2>Loading</h2><div class="hint">Reading the site data…</div></div>'; return; }
  if(active==='reports'){
    reportsView().then(el=>{ v.innerHTML=''; v.appendChild(el); });
    return;
  }
  if(active==='subs'){
    subsView().then(el=>{ v.innerHTML=''; v.appendChild(el); });
    return;
  }
  const content = active==='articles' ? articleView() : active==='writers' ? writersView() : tableView();
  if(typeof content==='string') v.innerHTML=content; else v.appendChild(content);
  if(active==='accounts') v.appendChild(accountsExtra());
  if(!readOnly()) v.appendChild(publishNote());
  
}

document.getElementById('signout').onclick=()=>{
  try{ localStorage.removeItem('fb_session_v1'); }catch(e){}
  location.href='../index.html';
};
document.getElementById('publish').onclick=saveAll;
window.saveAll=saveAll;
window.addEventListener('beforeunload',e=>{
  if(Object.values(data).some(d=>d&&d.dirty)){ e.preventDefault(); e.returnValue=''; }
});
if(!can(active)){ active = (role().tabs==='*') ? 'players' : role().tabs[0]; }
renderTabs(); render();
loadAll();
</script>
