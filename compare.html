<!DOCTYPE html>
<html lang="en">
<head>

<meta property="og:type" content="website">

<meta property="og:description" content="Compare any two Irish professionals side by side.">
<meta property="og:url" content="https://footballers.ie/compare.html">
<meta property="og:image" content="https://footballers.ie/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Compare players — FOOTBALLERS">
<meta name="twitter:description" content="Compare any two Irish professionals side by side.">
<meta name="twitter:image" content="https://footballers.ie/og-image.png">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>:root{
  --bg:#0C0F10; --panel:#151A1B; --panel2:#181E1F; --line:#242B2C;
  --white:#EFF3F1; --mute:#77837F; --yellow:#F5C518; --teal:#35D4BF; --red:#FF5A48;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--white);font-family:'Space Grotesk',sans-serif;line-height:1.4;min-height:100vh}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}
a{color:inherit;text-decoration:none}
button{font-family:inherit;background:none;border:0;color:inherit;cursor:pointer}
nav{display:flex;justify-content:space-between;align-items:center;padding:18px 0;border-bottom:1px solid var(--line);gap:14px;flex-wrap:wrap}
.mark{font-weight:700;font-size:19px;letter-spacing:-.01em}
.mark i{font-style:normal;color:var(--yellow);font-weight:600}
.navlinks{display:flex;gap:18px;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);flex-wrap:wrap}
.navlinks a{padding-bottom:2px;border-bottom:1px solid transparent}
.navlinks a:hover{color:var(--white)}
.navlinks a.on{color:var(--yellow);border-color:var(--yellow)}
.navmeta{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.1em;color:var(--mute)}
.navmeta b{color:var(--teal);font-weight:500}
.sec{margin:36px 0 14px;display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.sec h2{font-size:13px;font-family:'IBM Plex Mono',monospace;letter-spacing:.18em;text-transform:uppercase;color:var(--yellow)}
.sec .more{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);border-bottom:1px solid var(--line);padding-bottom:2px}
.sec .more:hover{color:var(--white)}
.pagehead{padding:34px 0 6px}
.pagehead h1{font-size:clamp(24px,4vw,34px);font-weight:700;letter-spacing:-.01em}
.pagehead h1 i{font-style:normal;color:var(--teal)}
.pagehead p{color:var(--mute);margin-top:8px;font-size:14px;max-width:56ch}
.crumb{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);padding-top:22px;display:inline-block}
.crumb:hover{color:var(--white)}
.carousel-wrap{position:relative}
.carousel{
  display:flex;overflow-x:auto;scroll-snap-type:x mandatory;
  -webkit-overflow-scrolling:touch;scrollbar-width:none;
  border:1px solid var(--line);border-radius:8px;background:var(--panel);
}
.carousel::-webkit-scrollbar{display:none}
.slide{
  flex:0 0 100%;scroll-snap-align:start;scroll-snap-stop:always;
  padding:26px 28px 44px;display:flex;flex-direction:column;justify-content:center;
  min-height:172px;
}
.slide .tag{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--teal);margin-bottom:10px}
.slide h3{font-size:clamp(20px,3vw,28px);font-weight:700;letter-spacing:-.01em;max-width:34ch;line-height:1.15}
.slide p{color:var(--mute);margin-top:8px;font-size:14px;max-width:50ch}
.dots{position:absolute;bottom:14px;right:18px;display:flex;gap:6px;z-index:2}
.dots button{width:20px;height:3px;border-radius:2px;background:var(--line);padding:0;transition:background .2s,width .2s}
.dots button[aria-current="true"]{background:var(--yellow);width:26px}
@media(max-width:700px){
  .slide{padding:20px 18px 42px;min-height:0}
  .slide h3{font-size:20px;line-height:1.2}
  .slide p{font-size:13px}
  .dots{bottom:12px;right:14px}
}
.giband{display:flex;gap:1px;overflow-x:auto;background:var(--line);border:1px solid var(--line);border-radius:6px;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.giband::-webkit-scrollbar{height:6px}
.giband::-webkit-scrollbar-track{background:transparent}
.giband::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
.gicard{flex:0 0 210px;background:var(--panel);padding:15px;display:block;transition:background .12s}
.gicard:hover{background:var(--panel2)}
.gicard .who{font-weight:600;font-size:15px}
.gicard .cl{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--mute);margin-top:2px}
.gicard .what{margin-top:10px;display:flex;gap:6px;flex-wrap:wrap}
.gitag{font-family:'IBM Plex Mono',monospace;font-size:10px;padding:3px 7px;border-radius:3px;background:rgba(53,212,191,.14);color:var(--teal)}
.gitag.a{background:rgba(245,197,24,.14);color:var(--yellow)}
.tiergroup{margin-bottom:24px}
.tiergroup h4{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);padding-bottom:8px;border-bottom:1px solid var(--line);margin-bottom:2px;display:flex;justify-content:space-between}
.plrow{display:grid;grid-template-columns:1fr auto auto;gap:14px;align-items:center;padding:11px 4px;border-bottom:1px solid #1B2122;font-size:14px}
.plrow:hover{background:var(--panel)}
.plrow:last-child{border-bottom:0}
.plrow .nm{font-weight:600}
.plrow .cl{color:var(--mute);font-family:'IBM Plex Mono',monospace;font-size:12px}
.plrow .ev{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--teal);white-space:nowrap}
.plrow .mn{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--mute);white-space:nowrap;text-align:right;min-width:38px}
.filterbar{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0 24px}
.filterbar input{flex:1 1 200px;background:var(--panel);border:1px solid var(--line);color:var(--white);padding:11px 14px;border-radius:6px;font-family:'Space Grotesk',sans-serif;font-size:14px}
.filterbar input::placeholder{color:var(--mute)}
.filterbar select{flex:0 1 200px;background:var(--panel);border:1px solid var(--line);color:var(--white);padding:11px 12px;border-radius:6px;font-family:'IBM Plex Mono',monospace;font-size:12px}
.emptystate{padding:30px 4px;color:var(--mute);font-family:'IBM Plex Mono',monospace;font-size:13px;display:none}
.squadgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.squadcard{background:var(--panel);padding:15px;display:block;transition:background .12s}
.squadcard:hover{background:var(--panel2)}
.squadcard .pos{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.12em;color:var(--yellow)}
.squadcard .who{font-weight:600;font-size:16px;margin-top:5px}
.squadcard .cl{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--mute);margin-top:3px}
.squadcard .caps{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--teal);margin-top:9px}
.clubgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.clubcard{background:var(--panel);padding:16px;display:block;transition:background .12s}
.clubcard:hover{background:var(--panel2)}
.clubcard .cn{font-weight:600;font-size:16px}
.clubcard .cl2{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--mute);margin-top:4px}
.clubcard .cc{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--teal);margin-top:10px}
.fxlist{border:1px solid var(--line);border-radius:6px;overflow:hidden}
.fxrow{display:grid;grid-template-columns:78px 1fr auto auto auto;gap:12px;align-items:center;padding:11px 14px;background:var(--panel);border-bottom:1px solid var(--line);font-size:14px}
.fxrow:last-child{border-bottom:0}
a.fxrow.lnk:hover{background:var(--panel2)}
.fxd{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--mute)}
.fxo{font-weight:500}
.fxo .cl{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--mute)}
.fxv{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--mute)}
.ha{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--yellow);border:1px solid var(--line);padding:1px 5px;border-radius:3px;margin-left:4px}
.fxc{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--mute);text-align:right}
.fxs{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:13px}
.fxev{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--teal)}
.fxm{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--mute);text-align:right;min-width:38px}
.pdhead{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;flex-wrap:wrap;padding:14px 0 6px}
.pdname{font-size:clamp(26px,4.5vw,42px);font-weight:700;letter-spacing:-.01em}
.pdmeta{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--mute);margin-top:8px;letter-spacing:.04em}
.pdmeta a{color:var(--teal)}
.pdmeta b{color:var(--teal);font-weight:500}
.pdborn{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--mute);margin-top:6px}
.pdbadge{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding:6px 12px;border-radius:20px;border:1px solid var(--line);color:var(--mute);white-space:nowrap}
.pdstats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.pds{background:var(--panel);padding:15px 14px}
.pds .n{font-family:'IBM Plex Mono',monospace;font-size:21px;font-weight:600}
.pds .l{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin-top:5px}
.intlblock{border:1px solid var(--line);border-radius:6px;padding:14px 16px;margin-bottom:10px;background:var(--panel)}
.ilvl{font-weight:600;font-size:15px}
.ilvl span{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--mute);font-weight:400;margin-left:8px}
.isub{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin:14px 0 7px}
.intlblock .fxlist{border-color:#1F2627}
.intlblock .fxrow{background:var(--bg)}
.eliglist{display:flex;gap:8px;flex-wrap:wrap}
.elig{border:1px solid var(--line);border-radius:6px;padding:11px 14px;background:var(--panel);min-width:170px}
.elig .ec{display:block;font-weight:600;font-size:15px}
.elig .en{display:block;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;margin-top:4px}
.elig.tied .ec{color:var(--teal)}
.elig.tied .en{color:var(--teal)}
.elig.open .en{color:var(--yellow)}
.elig.blocked{opacity:.38}
.elig.blocked .en{color:var(--mute);text-decoration:line-through}
.eligNote{color:var(--mute);font-size:13px;margin-top:12px;max-width:70ch;font-family:'IBM Plex Mono',monospace;line-height:1.7}
.tlist{border:1px solid var(--line);border-radius:6px;overflow:hidden}
.trow{display:grid;grid-template-columns:60px 1fr auto;gap:12px;padding:11px 14px;background:var(--panel);border-bottom:1px solid var(--line);font-size:14px}
.trow:last-child{border-bottom:0}
.ty{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--mute)}
.tfee{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--teal)}
.msgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.mscard{background:var(--panel);padding:15px;display:block;transition:background .12s}
.mscard:hover{background:var(--panel2)}
.mstag{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--yellow)}
.msn{font-weight:600;font-size:16px;margin-top:6px}
.msd{color:var(--mute);font-size:13px;margin-top:5px}
.msc{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--teal);margin-top:9px}
.tabbar{display:flex;gap:6px;flex-wrap:wrap;margin:22px 0 4px}
.tab{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--line);border-radius:20px;padding:8px 16px;color:var(--mute);background:var(--panel)}
.tab:hover{color:var(--white)}
.tab.on{background:var(--yellow);color:#0C0F10;border-color:var(--yellow)}
.tabpanel{display:none}
.tabpanel.on{display:block}
.cmpgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.cmphead{background:var(--panel2);padding:14px;font-weight:700;font-size:15px}
.cmpk{background:var(--panel);padding:12px 14px;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.cmpv{background:var(--panel);padding:12px 14px;font-family:'IBM Plex Mono',monospace;font-size:14px}
.cmpv.win{color:var(--teal);font-weight:600}
footer{margin-top:60px;border-top:1px solid var(--line);padding:20px 0 44px;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);line-height:2}

/* ============ RESPONSIVE ============ */
html{-webkit-text-size-adjust:100%}
body{overflow-x:hidden}
img,svg,iframe{max-width:100%}
.burger{display:none;width:44px;height:44px;border:1px solid var(--line);border-radius:6px;padding:0;position:relative;flex:none}
.burger span{display:block;position:absolute;left:12px;width:20px;height:2px;background:var(--white);transition:transform .2s,opacity .2s}
.burger span:nth-child(1){top:15px}
.burger span:nth-child(2){top:21px}
.burger span:nth-child(3){top:27px}
.burger.x span:nth-child(1){transform:translateY(6px) rotate(45deg)}
.burger.x span:nth-child(2){opacity:0}
.burger.x span:nth-child(3){transform:translateY(-6px) rotate(-45deg)}

@media(hover:none){
  a,button,select,input{-webkit-tap-highlight-color:rgba(245,197,24,.18)}
  .plrow,.gicard,.squadcard,.clubcard,.mscard,a.fxrow{min-height:52px}
}

/* ---- tablet ---- */
@media(max-width:900px){
  .wrap{padding:0 16px}
  .navlinks{gap:14px;font-size:10px}
  .pdstats{grid-template-columns:repeat(4,1fr)}
}

/* ---- phone ---- */
@media(max-width:700px){
  .wrap{padding:0 14px}

  /* nav becomes a drawer */
  nav{padding:14px 0;flex-wrap:nowrap;gap:10px}
  .mark{font-size:17px;flex:1}
  .burger{display:block}
  .navmeta{display:none}
  .navlinks{
    display:none;position:absolute;left:0;right:0;top:100%;z-index:60;
    flex-direction:column;gap:0;background:var(--panel);
    border-top:1px solid var(--line);border-bottom:1px solid var(--line);
  }
  nav{position:relative}
  .navlinks.open{display:flex}
  .navlinks a{
    padding:15px 16px;border-bottom:1px solid var(--line);border-left:2px solid transparent;
    font-size:12px;letter-spacing:.12em;
  }
  .navlinks a:last-child{border-bottom:0}
  .navlinks a.on{border-left-color:var(--yellow);border-bottom-color:var(--line);background:var(--panel2)}

  /* headings */
  .pagehead{padding:24px 0 4px}
  .pagehead h1{font-size:26px}
  .pagehead p{font-size:14px}
  .sec{margin:28px 0 12px}
  .sec h2{font-size:11px;letter-spacing:.14em}

  /* carousel */
  .carousel{min-height:0}
  .slide{padding:20px 18px 46px}
  .slide h3{font-size:20px;line-height:1.2}
  .slide p{font-size:13px}
  .dots{bottom:14px;right:16px}

  /* horizontal strips get edge-to-edge scroll */
  .giband{border-radius:0;border-left:0;border-right:0;margin:0 -14px;scroll-snap-type:x mandatory}
  .gicard{flex:0 0 76vw;max-width:280px;scroll-snap-align:start}

  /* player rows */
  .plrow{grid-template-columns:1fr auto;gap:10px;padding:13px 2px}
  .plrow .nm{font-size:15px;line-height:1.25}
  .plrow .cl{display:block;margin-top:2px}
  .plrow .mn{display:none}

  /* fixtures & results: drop the trailing competition column, keep the numbers */
  .fxlist{border-radius:6px}
  .fxrow{grid-template-columns:58px 1fr auto;gap:10px;padding:12px;font-size:14px}
  .fxc{display:none}
  .fxv{font-size:12px}
  .fxs,.fxev{font-size:13px}
  .fxm{min-width:32px;font-size:11px}

  /* player header */
  .pdhead{padding:10px 0 4px;gap:12px}
  .pdname{font-size:28px;line-height:1.05}
  .pdmeta{font-size:11px;line-height:1.7}
  .pdbadge{font-size:10px;padding:5px 10px}
  .pdstats{grid-template-columns:repeat(2,1fr)}
  .pds{padding:13px 12px}
  .pds .n{font-size:19px}

  /* grids collapse to single column */
  .squadgrid,.clubgrid,.msgrid{grid-template-columns:1fr}
  .squadcard,.clubcard,.mscard{padding:14px}

  /* filters stack full width and stay tappable */
  .filterbar{gap:8px;margin:16px 0 20px}
  .filterbar input,.filterbar select{flex:1 1 100%;min-height:46px;font-size:16px}

  /* international blocks */
  .intlblock{padding:12px 13px}
  .ilvl{font-size:14px}
  .ilvl span{display:block;margin-left:0;margin-top:4px}

  /* eligibility cards full width */
  .eliglist{flex-direction:column}
  .elig{min-width:0;width:100%}
  .eligNote{font-size:12px;line-height:1.65}

  /* transfers */
  .trow{grid-template-columns:50px 1fr;gap:8px;padding:12px;font-size:13px}
  .tfee{grid-column:2;font-size:11px}

  /* tabs scroll horizontally rather than wrapping into a block */
  .tabbar{flex-wrap:nowrap;overflow-x:auto;margin:16px -14px 4px;padding:0 14px 4px;scrollbar-width:none}
  .tabbar::-webkit-scrollbar{display:none}
  .tab{flex:none;padding:9px 15px;font-size:11px}

  /* compare stays 3 columns — stacking loses the comparison */
  .cmpgrid{grid-template-columns:1.1fr 1fr 1fr}
  .cmphead{padding:11px 9px;font-size:13px}
  .cmpk{padding:10px 9px;font-size:9px;letter-spacing:.04em}
  .cmpv{padding:10px 9px;font-size:12px}

  footer{margin-top:40px;padding:18px 0 36px;font-size:9px}
}

/* ---- small phone ---- */
@media(max-width:380px){
  .pagehead h1{font-size:23px}
  .pdname{font-size:24px}
  .pdstats{grid-template-columns:repeat(2,1fr)}
  .gicard{flex:0 0 84vw}
  .cmpgrid{grid-template-columns:1fr 1fr 1fr}
  .cmpk{font-size:8px}
}

/* notch / home-indicator safe areas */
@supports(padding:max(0px)){
  .wrap{padding-left:max(14px,env(safe-area-inset-left));padding-right:max(14px,env(safe-area-inset-right))}
  footer{padding-bottom:max(36px,env(safe-area-inset-bottom))}
}

/* ============ NEWSLETTER ============ */
.nlbar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
  border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:16px 18px;margin:30px 0}
.nltext{font-size:14px;color:var(--mute)}
.nltext b{color:var(--white);font-weight:600}
.nlbox{border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:24px;margin:34px 0}
.nltag{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--yellow)}
.nlh{font-size:clamp(19px,2.6vw,25px);font-weight:700;margin-top:10px;letter-spacing:-.01em;max-width:26ch}
.nlcols{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);
  border-radius:6px;overflow:hidden;margin:18px 0}
.nlcol{background:var(--bg);padding:15px}
.nlday{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--teal)}

/* ============ PAGE LOADER ============ */
#fbload{
  position:fixed;inset:0;z-index:400;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;
  background:var(--bg);opacity:1;transition:opacity .32s ease;
}
#fbload.out{opacity:0;pointer-events:none}
.fbl-mark{
  font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:22px;letter-spacing:-.01em;
  color:var(--white);opacity:0;animation:fblIn .5s ease forwards;
}
.fbl-mark i{font-style:normal;color:var(--yellow)}
@keyframes fblIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* the stage: ball sits dead centre under the wordmark, boot arrives from the left */
.fbl-pitch{position:relative;width:240px;height:60px;overflow:hidden}

.fbl-ball{
  position:absolute;left:50%;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px;
  animation:fblFly 2.4s cubic-bezier(.22,.7,.35,1) infinite;
}
.fbl-ball i{
  display:block;width:100%;height:100%;border-radius:50%;background:var(--white);
  background-image:radial-gradient(circle at 33% 32%, #0C0F10 0 3px, transparent 3.2px),
                   radial-gradient(circle at 70% 64%, #0C0F10 0 2.4px, transparent 2.6px),
                   radial-gradient(circle at 52% 88%, #0C0F10 0 1.8px, transparent 2px);
  animation:fblSpin 2.4s cubic-bezier(.22,.7,.35,1) infinite;
}
@keyframes fblFly{
  0%, 20%  {transform:translate(0,0);opacity:0}      /* ball fades in first */
  26%      {transform:translate(0,0);opacity:1}
  46%      {transform:translate(0,0);opacity:1}      /* waits for the boot */
  62%      {transform:translate(78px,-26px);opacity:1}
  76%      {transform:translate(150px,-14px);opacity:1}
  86%      {transform:translate(210px,10px);opacity:0}  /* out of frame */
  100%     {transform:translate(210px,10px);opacity:0}
}
@keyframes fblSpin{
  0%,46%{transform:rotate(0)}
  86%,100%{transform:rotate(620deg)}
}

/* boot slides in from the left, plants, swings through the ball, retreats */
.fbl-boot{
  position:absolute;left:50%;top:50%;width:38px;height:44px;margin:-26px 0 0 -62px;
  overflow:visible;opacity:0;
  animation:fblBootIn 2.4s cubic-bezier(.3,.7,.3,1) infinite;
}
.fbl-leg line{stroke:var(--mute);stroke-width:2.8;stroke-linecap:round;fill:none}
.fbl-leg{transform-origin:20px 4px;animation:fblKick 2.4s cubic-bezier(.35,0,.25,1) infinite}
@keyframes fblBootIn{
  0%,24%  {opacity:0;transform:translateX(-26px)}
  34%     {opacity:1;transform:translateX(0)}
  70%     {opacity:1;transform:translateX(0)}
  84%,100%{opacity:0;transform:translateX(-20px)}
}
@keyframes fblKick{
  0%,36%  {transform:rotate(14deg)}
  48%     {transform:rotate(-32deg)}   /* wind up */
  58%     {transform:rotate(30deg)}    /* strike */
  74%     {transform:rotate(12deg)}
  100%    {transform:rotate(14deg)}
}

@media(prefers-reduced-motion:reduce){
  .fbl-mark{animation:none;opacity:1}
  .fbl-leg,.fbl-ball,.fbl-ball i,.fbl-boot{animation:none}
  .fbl-ball{opacity:1}
  .fbl-boot{opacity:1;transform:none}
}

<script>/* footballers.ie — favourites
   Stored in the browser (localStorage). No account needed.
   Powers: star toggles, the "Your players" rail, and the alerts page. */
(function () {
  var KEY = 'fb_favs_v1';

  function read() {
    try { return JSON.parse(localStorage.getItem(KEY)) || []; }
    catch (e) { return []; }
  }
  function write(list) {
    try { localStorage.setItem(KEY, JSON.stringify(list)); } catch (e) {}
    document.dispatchEvent(new CustomEvent('favschange', { detail: list }));
  }
  function has(slug) { return read().indexOf(slug) > -1; }
  function toggle(slug) {
    var list = read(), i = list.indexOf(slug);
    if (i > -1) list.splice(i, 1); else list.push(slug);
    write(list);
    return list.indexOf(slug) > -1;
  }

  window.FB = { read: read, write: write, has: has, toggle: toggle };

  /* ---- wire up every star on the page ---- */
  function paint(btn) {
    var on = has(btn.dataset.fav);
    btn.classList.toggle('on', on);
    btn.setAttribute('aria-pressed', on ? 'true' : 'false');
    btn.title = on ? 'Remove from your players' : 'Add to your players';
  }
  function init() {
    var stars = document.querySelectorAll('[data-fav]');
    for (var i = 0; i < stars.length; i++) {
      (function (btn) {
        paint(btn);
        btn.addEventListener('click', function (e) {
          e.preventDefault(); e.stopPropagation();
          var slug = btn.dataset.fav;
          function apply() {
            toggle(slug);
            var all = document.querySelectorAll('[data-fav="' + slug + '"]');
            for (var j = 0; j < all.length; j++) paint(all[j]);
          }
          // unfollowing never asks; following asks once
          if (has(slug) || !window.FB_GATE) { apply(); return; }
          FB_GATE(slug, apply);
        });
      })(stars[i]);
    }
    renderMine();
    updateCount();
  }

  function updateCount() {
    var n = read().length;
    var els = document.querySelectorAll('[data-fav-count]');
    for (var i = 0; i < els.length; i++) els[i].textContent = n;
    var nav = document.getElementById('nav-mine');
    if (nav) nav.style.display = n ? '' : 'none';
  }

  /* ---- "Your players" rail on the homepage ---- */
  function renderMine() {
    var wrap = document.getElementById('myplayers');
    if (!wrap || !window.FB_PLAYERS) return;
    var favs = read();
    var empty = document.getElementById('myplayers-empty');

    if (!favs.length) {
      wrap.innerHTML = '';
      if (empty) empty.style.display = 'block';
      var sec = document.getElementById('myplayers-sec');
      if (sec) sec.style.display = 'none';
      return;
    }
    if (empty) empty.style.display = 'none';
    var sec2 = document.getElementById('myplayers-sec');
    if (sec2) sec2.style.display = '';

    var rows = '';
    favs.forEach(function (slug) {
      var p = window.FB_PLAYERS[slug];
      if (!p) return;
      var when = p.next ? p.next : 'No fixture listed';
      var face2 = p.img ? 'img/players/' + slug + '.png' : '';
      var av2 = face2
        ? '<div class="pavatar sm"><img src="' + face2 + '" alt="" loading="lazy" ' +
          'onerror="this.parentNode.innerHTML=\'<span>' + p.ini + '</span>\'"></div>'
        : '<div class="pavatar sm"><span>' + p.ini + '</span></div>';
      rows += '<a class="plrow" href="player/' + slug + '.html">' + av2 +
              '<div class="nm">' + p.n + ' <span class="cl">' + p.club + '</span></div>' +
              '<div class="ev">' + when + '</div>' +
              '<button class="star on" data-fav="' + slug + '" aria-pressed="true">★</button></a>';
    });
    wrap.innerHTML = rows;

    var stars = wrap.querySelectorAll('[data-fav]');
    for (var i = 0; i < stars.length; i++) {
      (function (btn) {
        btn.addEventListener('click', function (e) {
          e.preventDefault(); e.stopPropagation();
          var slug = btn.dataset.fav;
          function apply() {
            toggle(slug); renderMine(); updateCount();
            var all = document.querySelectorAll('[data-fav="' + slug + '"]');
            for (var j = 0; j < all.length; j++) paint(all[j]);
          }
          if (has(slug) || !window.FB_GATE) { apply(); return; }
          FB_GATE(slug, apply);
        });
      })(stars[i]);
    }
  }

  document.addEventListener('favschange', function () { renderMine(); updateCount(); });

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();

/* ---------- MATCH CENTRE ----------
   Always on. What it shows depends on where "now" sits between matches:
     · anything live  -> always shown first
     · just finished  -> the result stays up until the halfway point to the next
                         kick-off, then the upcoming match takes over
   So if the next game is 7 days away, the last result sits there for 3½ days,
   then flips to "in 3 days" counting down to the next one. */
(function () {
  var MATCH_LEN = 2 * 60 * 60 * 1000;   // treat a match as ~2h long

  function ko(m) { return new Date(m.kickoff).getTime(); }
  function ended(m) { return ko(m) + MATCH_LEN; }

  function statusChip(m, now) {
    if (m.status === 'live') {
      return '<span class="mcstat live"><i></i>' + (m.minute ? m.minute + "'" : 'LIVE') + '</span>';
    }
    if (m.status === 'ft' || ended(m) < now) {
      var ago = now - ended(m);
      var d = Math.floor(ago / 86400000);
      if (d >= 1) return '<span class="mcstat ft">FT · ' + d + (d === 1 ? ' day ago' : ' days ago') + '</span>';
      var h = Math.floor(ago / 3600000);
      if (h >= 1) return '<span class="mcstat ft">FT · ' + h + 'h ago</span>';
      return '<span class="mcstat ft">Full time</span>';
    }
    var until = ko(m) - now;
    var days = Math.floor(until / 86400000);
    if (days >= 1) return '<span class="mcstat soon">in ' + days + (days === 1 ? ' day' : ' days') + '</span>';
    var hrs = Math.floor(until / 3600000);
    if (hrs >= 1) return '<span class="mcstat soon">in ' + hrs + (hrs === 1 ? ' hour' : ' hours') + '</span>';
    var mins = Math.max(0, Math.round(until / 60000));
    return '<span class="mcstat soon">' + (mins <= 1 ? 'Kick-off' : 'in ' + mins + ' min') + '</span>';
  }

  function score(m, now) {
    var played = m.status === 'live' || m.status === 'ft' || ended(m) < now;
    if (!played || m.hs === '' || m.hs === null || m.hs === undefined) {
      var d = new Date(m.kickoff);
      var day = d.toLocaleDateString([], { weekday: 'short' });
      var time = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      return '<div class="mcko"><span class="mcday">' + day + '</span>' + time + '</div>';
    }
    return '<div class="mcscore">' + m.hs + '<span>–</span>' + m.as_ + '</div>';
  }

  /* Decide which matches deserve the two slots. */
  function choose(all, now) {
    var live = [], past = [], future = [];
    all.forEach(function (m) {
      if (m.status === 'live' && ended(m) > now) live.push(m);
      else if (m.status === 'ft' || ended(m) <= now) past.push(m);
      else future.push(m);
    });
    past.sort(function (a, b) { return ko(b) - ko(a); });     // most recent first
    future.sort(function (a, b) { return ko(a) - ko(b); });   // soonest first

    if (live.length) return live.concat(future).slice(0, 2);

    var lastM = past[0], nextM = future[0];

    if (lastM && nextM) {
      var midpoint = ended(lastM) + (ko(nextM) - ended(lastM)) / 2;
      // before halfway: the result still leads. after: the next game leads.
      return (now < midpoint) ? [lastM, nextM] : [nextM, lastM];
    }
    if (nextM) return future.slice(0, 2);
    if (lastM) return past.slice(0, 2);
    return [];
  }

  function render() {
    var sec = document.getElementById('mc-sec'), box = document.getElementById('mc');
    if (!sec || !box || !window.FB_MATCHES) return;
    var now = Date.now();
    var all = FB_MATCHES.slice();

    sec.style.display = '';                       // always on

    if (!all.length) {
      box.innerHTML = '<div class="emptybox">No fixtures loaded yet.</div>';
      var m0 = document.getElementById('mc-more');
      if (m0) m0.style.display = 'none';
      return;
    }

    var shown = choose(all, now);

    box.innerHTML = shown.map(function (m) {
      var players = m.players.slice(0, 2).map(function (p) {
        var face = p.photo ? p.photo : (p.img ? 'img/players/' + p.slug + '.png' : '');
        var av = face
          ? '<div class="pavatar sm"><img src="' + face + '" alt="" loading="lazy" ' +
            'onerror="this.parentNode.innerHTML=\'<span>' + p.ini + '</span>\'"></div>'
          : '<div class="pavatar sm"><span>' + p.ini + '</span></div>';
        return '<a class="mcp" href="player/' + p.slug + '.html" title="' + p.n + '">' +
               av + '<span class="mcpn">' + p.n + '</span></a>';
      }).join('');
      if (m.players.length > 2) {
        players += '<span class="mcmore">+' + (m.players.length - 2) + ' more</span>';
      }
      return '<div class="mccard" data-href="match/' + m.id + '.html" role="link" tabindex="0">' +
             '<div class="mcrow">' +
               '<span class="mccomp">' + m.comp + '</span>' + statusChip(m, now) +
             '</div>' +
             '<div class="mcteams"><div class="mct">' + m.home + '</div>' + score(m, now) +
             '<div class="mct right">' + m.away + '</div></div>' +
             '<div class="mcplayers">' + players + '</div></div>';
    }).join('');

    var cards = box.querySelectorAll('.mccard');
    for (var c = 0; c < cards.length; c++) {
      (function (card) {
        function go(e) {
          if (e.target.closest && e.target.closest('a')) return;
          location.href = card.getAttribute('data-href');
        }
        card.addEventListener('click', go);
        card.addEventListener('keydown', function (e) {
          if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(e); }
        });
      })(cards[c]);
    }

    var more = document.getElementById('mc-more');
    if (more) {
      if (all.length > shown.length) {
        more.style.display = '';
        more.textContent = 'See all ' + all.length + ' →';
      } else {
        more.style.display = 'none';
      }
    }
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', render);
  else render();
  setInterval(render, 60000);
})();

/* ---------- FOLLOW PROMPT ----------
   A small toast that slides in the first time someone opens a player page,
   then again every 10th player after that. Dismissed by tapping or following. */
(function () {
  var KEY = 'fb_seen_players_v1', DISMISS = 'fb_prompt_off_v1';
  var slug = document.body.getAttribute('data-player');
  if (!slug) return;                                   // only on player pages
  if (localStorage.getItem(DISMISS) === '1') return;   // user closed it for good

  var seen;
  try { seen = JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) { seen = []; }
  if (seen.indexOf(slug) === -1) { seen.push(slug); }
  try { localStorage.setItem(KEY, JSON.stringify(seen)); } catch (e) {}

  var n = seen.length;
  if (!(n === 1 || n % 10 === 0)) return;
  if (window.FB && FB.has(slug)) return;               // already following this one

  function show() {
    var t = document.createElement('div');
    t.className = 'fbtoast';
    t.innerHTML =
      '<div class="fbt-star">★</div>' +
      '<div class="fbt-copy"><b>Follow this player</b>' +
      '<span>Tap the star to get their goals, ratings and kick-offs.</span></div>' +
      '<button class="fbt-x" aria-label="Dismiss">×</button>';
    document.body.appendChild(t);
    requestAnimationFrame(function () { t.classList.add('in'); });

    var starBtn = document.querySelector('.starbtn');
    if (starBtn) {
      starBtn.classList.add('pulse');
      setTimeout(function () { starBtn.classList.remove('pulse'); }, 4000);
    }

    function close(forever) {
      t.classList.remove('in');
      setTimeout(function () { if (t.parentNode) t.parentNode.removeChild(t); }, 400);
      if (forever) { try { localStorage.setItem(DISMISS, '1'); } catch (e) {} }
    }
    t.querySelector('.fbt-x').addEventListener('click', function (e) { e.stopPropagation(); close(true); });
    t.addEventListener('click', function () {
      if (starBtn) starBtn.click();
      close(false);
    });
    document.addEventListener('favschange', function () { close(false); });
    setTimeout(function () { close(false); }, 8000);
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', function(){ setTimeout(show, 700); });
  else setTimeout(show, 700);
})();

/* ---------- EMAIL GATE ----------
   The first time someone follows a player we ask for an email, so their list
   can be synced and alerts can be sent. Asked once per browser, then never again. */
(function () {
  var EKEY = 'fb_email_v1';

  function saved() { try { return localStorage.getItem(EKEY) || ''; } catch (e) { return ''; } }
  window.FB_EMAIL = saved;

  function send(email, slug) {
    try { localStorage.setItem(EKEY, email); } catch (e) {}
    var url = window.FB_SUBSCRIBE_URL;
    if (url) {
      try {
        fetch(url, {
          method: 'POST', mode: 'no-cors',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: 'email=' + encodeURIComponent(email) + '&players=' + encodeURIComponent(slug || '')
        });
      } catch (e) {}
    }
  }

  /* returns true if we can follow straight away */
  window.FB_GATE = function (slug, proceed) {
    if (saved()) { proceed(); return; }

    var wrap = document.createElement('div');
    wrap.className = 'fbgate';
    wrap.innerHTML =
      '<div class="fbg-card" role="dialog" aria-modal="true" aria-labelledby="fbg-t">' +
        '<button class="fbg-x" aria-label="Cancel">×</button>' +
        '<div class="fbg-star">★</div>' +
        '<h3 id="fbg-t">Save your players</h3>' +
        '<p>Pop in your email and we\'ll keep your list safe — and let you know ' +
           'when your players are about to play, score or get rated.</p>' +
        '<form class="fbg-form">' +
          '<input type="email" required placeholder="your@email.ie" aria-label="Email address" autocomplete="email">' +
          '<button type="submit">Follow</button>' +
        '</form>' +
        '<div class="fbg-fine">One email to set up. Unsubscribe any time.</div>' +
      '</div>';
    document.body.appendChild(wrap);
    requestAnimationFrame(function () { wrap.classList.add('in'); });
    var input = wrap.querySelector('input');
    setTimeout(function () { input.focus(); }, 260);

    function close() {
      wrap.classList.remove('in');
      setTimeout(function () { if (wrap.parentNode) wrap.parentNode.removeChild(wrap); }, 280);
      document.removeEventListener('keydown', onKey);
    }
    function onKey(e) { if (e.key === 'Escape') close(); }
    document.addEventListener('keydown', onKey);

    wrap.querySelector('.fbg-x').addEventListener('click', close);
    wrap.addEventListener('click', function (e) { if (e.target === wrap) close(); });
    wrap.querySelector('.fbg-form').addEventListener('submit', function (e) {
      e.preventDefault();
      var v = input.value.trim();
      if (!v || v.indexOf('@') === -1) { input.focus(); return; }
      send(v, slug);
      close();
      proceed();
    });
  };
})();

/* ---------- BACK LINK ----------
   "← Back" returns to wherever you actually came from. We mark the session on
   each page view, so if this isn't the first page in the tab we can safely use
   history. A direct landing (shared link, search result) uses the href fallback. */
(function () {
  var NAV = 'fb_nav_v1';
  var visitedBefore = false;
  try {
    visitedBefore = sessionStorage.getItem(NAV) === '1';
    sessionStorage.setItem(NAV, '1');
  } catch (e) {}

  var links = document.querySelectorAll('.crumb[data-back]');
  if (!links.length) return;

  for (var i = 0; i < links.length; i++) {
    links[i].addEventListener('click', function (e) {
      if (visitedBefore && history.length > 1) {
        e.preventDefault();
        history.back();
      }
    });
  }
})();

/* ---------- ADMIN DOOR ----------
   Double-click the wordmark to sign in. Accounts and roles come from
   data/manual/accounts.csv. Remembered after the first sign-in.
   Note: this check runs in the browser — it keeps visitors out, it is not
   server-side security. */
(function () {
  var SESS = 'fb_session_v1';
  var mark = document.querySelector('.mark');
  if (!mark) return;

  function adminUrl() {
    var inSub = /\/(player|club|news|match)\//.test(location.pathname);
    return (inSub ? '../' : '') + 'build/admin.html';
  }
  function session() {
    try { return JSON.parse(localStorage.getItem(SESS) || 'null'); } catch (e) { return null; }
  }

  async function sha256(s) {
    if (window.crypto && crypto.subtle && window.isSecureContext) {
      var buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
      return Array.from(new Uint8Array(buf)).map(function (b) {
        return b.toString(16).padStart(2, '0');
      }).join('');
    }
    return sha256js(s);
  }
  function sha256js(ascii) {
    function rr(n, x) { return (x >>> n) | (x << (32 - n)); }
    var K = [], H = [], i, j, p = 2, primes = [];
    function isP(n){ for(var d=2;d*d<=n;d++) if(n%d===0) return false; return true; }
    while (primes.length < 64) { if (isP(p)) primes.push(p); p++; }
    for (i = 0; i < 64; i++) K[i] = (Math.pow(primes[i], 1/3) % 1 * Math.pow(2,32)) | 0;
    for (i = 0; i < 8; i++) H[i] = (Math.pow(primes[i], 1/2) % 1 * Math.pow(2,32)) | 0;
    var bytes = unescape(encodeURIComponent(ascii)), len = bytes.length, words = [];
    for (i = 0; i < len; i++) words[i>>2] |= bytes.charCodeAt(i) << ((3 - i % 4) * 8);
    words[len>>2] |= 0x80 << ((3 - len % 4) * 8);
    words[((len + 8 >> 6) + 1) * 16 - 1] = len * 8;
    var w = [], a,b,c,d,e,f,g,h,t1,t2;
    for (j = 0; j < words.length; j += 16) {
      a=H[0];b=H[1];c=H[2];d=H[3];e=H[4];f=H[5];g=H[6];h=H[7];
      for (i = 0; i < 64; i++) {
        w[i] = i < 16 ? (words[j+i]|0) :
          (rr(17,w[i-2])^rr(19,w[i-2])^(w[i-2]>>>10)) + (w[i-7]|0) +
          (rr(7,w[i-15])^rr(18,w[i-15])^(w[i-15]>>>3)) + (w[i-16]|0);
        t1 = h + (rr(6,e)^rr(11,e)^rr(25,e)) + ((e&f)^(~e&g)) + K[i] + (w[i]|0);
        t2 = (rr(2,a)^rr(13,a)^rr(22,a)) + ((a&b)^(a&c)^(b&c));
        h=g;g=f;f=e;e=(d+t1)|0;d=c;c=b;b=a;a=(t1+t2)|0;
      }
      H[0]=(H[0]+a)|0;H[1]=(H[1]+b)|0;H[2]=(H[2]+c)|0;H[3]=(H[3]+d)|0;
      H[4]=(H[4]+e)|0;H[5]=(H[5]+f)|0;H[6]=(H[6]+g)|0;H[7]=(H[7]+h)|0;
    }
    return H.map(function(x){ return ((x>>>0).toString(16)).padStart(8,'0'); }).join('');
  }

  function open() {
    if (session()) { location.href = adminUrl(); return; }

    var wrap = document.createElement('div');
    wrap.className = 'fbgate';
    wrap.innerHTML =
      '<div class="fbg-card" role="dialog" aria-modal="true">' +
        '<button class="fbg-x" aria-label="Close">×</button>' +
        '<h3>Sign in</h3><p>Staff access.</p>' +
        '<form class="fbg-form" style="flex-direction:column">' +
          '<input type="email" id="ae" placeholder="Email" autocomplete="username" required>' +
          '<input type="password" id="ap" placeholder="Password" autocomplete="current-password" required>' +
          '<button type="submit" style="width:100%">Sign in</button>' +
        '</form>' +
        '<div class="nlnote" id="aerr" style="display:none">Wrong email or password.</div>' +
      '</div>';
    document.body.appendChild(wrap);
    requestAnimationFrame(function () { wrap.classList.add('in'); });
    setTimeout(function () { var e = wrap.querySelector('#ae'); if (e) e.focus(); }, 240);

    function close() {
      wrap.classList.remove('in');
      setTimeout(function () { if (wrap.parentNode) wrap.parentNode.removeChild(wrap); }, 280);
      document.removeEventListener('keydown', onKey);
    }
    function onKey(e) { if (e.key === 'Escape') close(); }
    document.addEventListener('keydown', onKey);
    wrap.querySelector('.fbg-x').addEventListener('click', close);
    wrap.addEventListener('click', function (e) { if (e.target === wrap) close(); });

    wrap.querySelector('.fbg-form').addEventListener('submit', async function (e) {
      e.preventDefault();
      var em = wrap.querySelector('#ae').value.trim().toLowerCase();
      var pw = wrap.querySelector('#ap').value;
      var h = await sha256(em + ':' + pw);
      var accounts = window.FB_ACCOUNTS || [];
      var found = null;
      for (var i = 0; i < accounts.length; i++) {
        if ((accounts[i].email || '').toLowerCase() === em && accounts[i].hash === h) { found = accounts[i]; break; }
      }
      if (found) {
        try {
          localStorage.setItem(SESS, JSON.stringify({
            email: found.email, name: found.name, role: found.role, hash: h
          }));
        } catch (err) {}
        close();
        location.href = adminUrl();
      } else {
        wrap.querySelector('#aerr').style.display = 'block';
        wrap.querySelector('#ap').value = '';
        wrap.querySelector('#ap').focus();
      }
    });
  }

  var clicks = 0, timer = null;
  mark.addEventListener('click', function (e) {
    e.preventDefault();
    clicks++;
    if (clicks === 1) {
      timer = setTimeout(function () { clicks = 0; location.href = mark.getAttribute('href'); }, 260);
    } else {
      clearTimeout(timer); clicks = 0; open();
    }
  });
  var hold;
  mark.addEventListener('touchstart', function () {
    hold = setTimeout(function () { clicks = 0; clearTimeout(timer); open(); }, 650);
  }, {passive:true});
  ['touchend','touchmove','touchcancel'].forEach(function (ev) {
    mark.addEventListener(ev, function () { clearTimeout(hold); }, {passive:true});
  });
})();

/* ---------- LOCAL KICK-OFF TIMES ----------
   Match pages are built with UTC timestamps; show them in the visitor's own
   timezone so they match the homepage. */
(function () {
  var els = document.querySelectorAll('[data-ko]');
  for (var i = 0; i < els.length; i++) {
    (function (el) {
      var d = new Date(el.getAttribute('data-ko'));
      if (isNaN(d)) return;
      var time = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      if (el.classList.contains('ko-time')) {
        el.textContent = time;
      } else {
        el.textContent = time + ' · ' + d.toLocaleDateString([], {
          weekday: 'short', day: 'numeric', month: 'short'
        });
      }
    })(els[i]);
  }
})();
</script>
