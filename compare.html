<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Compare players — FOOTBALLERS</title>
<meta name="description" content="Compare any two Irish professionals side by side.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>:root{
  --bg:#0C0F10; --panel:#151A1B; --panel2:#181E1F; --line:#242B2C;
  --white:#EFF3F1; --mute:#77837F; --yellow:#F5C518; --teal:#35D4BF; --red:#FF5A48;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--white);font-family:'Space Grotesk',sans-serif;line-height:1.4;min-height:100vh}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}
a{color:inherit;text-decoration:none}
button{font-family:inherit;background:none;border:0;color:inherit;cursor:pointer}
nav{display:flex;justify-content:space-between;align-items:center;padding:18px 0;border-bottom:1px solid var(--line);gap:14px;flex-wrap:wrap}
.mark{font-weight:700;font-size:19px}
.mark i{font-style:normal;color:var(--yellow)}
.navlinks{display:flex;gap:18px;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);flex-wrap:wrap}
.navlinks a{padding-bottom:2px;border-bottom:1px solid transparent}
.navlinks a:hover{color:var(--white)}
.navlinks a.on{color:var(--yellow);border-color:var(--yellow)}
.navmeta{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.1em;color:var(--mute)}
.navmeta b{color:var(--teal);font-weight:500}
.sec{margin:36px 0 14px;display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.sec h2{font-size:13px;font-family:'IBM Plex Mono',monospace;letter-spacing:.18em;text-transform:uppercase;color:var(--yellow)}
.sec .more{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);border-bottom:1px solid var(--line);padding-bottom:2px}
.sec .more:hover{color:var(--white)}
.pagehead{padding:34px 0 6px}
.pagehead h1{font-size:clamp(24px,4vw,34px);font-weight:700;letter-spacing:-.01em}
.pagehead h1 i{font-style:normal;color:var(--teal)}
.pagehead p{color:var(--mute);margin-top:8px;font-size:14px;max-width:56ch}
.crumb{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);padding-top:22px;display:inline-block}
.crumb:hover{color:var(--white)}
.carousel{position:relative;border:1px solid var(--line);border-radius:8px;overflow:hidden;min-height:172px;background:var(--panel)}
.slide{position:absolute;inset:0;padding:26px 28px;display:flex;flex-direction:column;justify-content:center;opacity:0;transition:opacity .4s;pointer-events:none}
.slide.on{opacity:1;pointer-events:auto;position:relative}
.slide .tag{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--teal);margin-bottom:10px}
.slide h3{font-size:clamp(20px,3vw,28px);font-weight:700;letter-spacing:-.01em;max-width:34ch;line-height:1.15}
.slide p{color:var(--mute);margin-top:8px;font-size:14px;max-width:50ch}
.dots{position:absolute;bottom:16px;right:20px;display:flex;gap:6px;z-index:2}
.dots button{width:20px;height:3px;border-radius:2px;background:var(--line);padding:0}
.dots button[aria-current="true"]{background:var(--yellow)}
.giband{display:flex;gap:1px;overflow-x:auto;background:var(--line);border:1px solid var(--line);border-radius:6px;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.giband::-webkit-scrollbar{height:6px}
.giband::-webkit-scrollbar-track{background:transparent}
.giband::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
.gicard{flex:0 0 210px;background:var(--panel);padding:15px;display:block;transition:background .12s}
.gicard:hover{background:var(--panel2)}
.gicard .who{font-weight:600;font-size:15px}
.gicard .cl{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--mute);margin-top:2px}
.gicard .what{margin-top:10px;display:flex;gap:6px;flex-wrap:wrap}
.gitag{font-family:'IBM Plex Mono',monospace;font-size:10px;padding:3px 7px;border-radius:3px;background:rgba(53,212,191,.14);color:var(--teal)}
.gitag.a{background:rgba(245,197,24,.14);color:var(--yellow)}
.tiergroup{margin-bottom:24px}
.tiergroup h4{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);padding-bottom:8px;border-bottom:1px solid var(--line);margin-bottom:2px;display:flex;justify-content:space-between}
.plrow{display:grid;grid-template-columns:1fr auto auto;gap:14px;align-items:center;padding:11px 4px;border-bottom:1px solid #1B2122;font-size:14px}
.plrow:hover{background:var(--panel)}
.plrow:last-child{border-bottom:0}
.plrow .nm{font-weight:600}
.plrow .cl{color:var(--mute);font-family:'IBM Plex Mono',monospace;font-size:12px}
.plrow .ev{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--teal);white-space:nowrap}
.plrow .mn{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--mute);white-space:nowrap;text-align:right;min-width:38px}
.filterbar{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0 24px}
.filterbar input{flex:1 1 200px;background:var(--panel);border:1px solid var(--line);color:var(--white);padding:11px 14px;border-radius:6px;font-family:'Space Grotesk',sans-serif;font-size:14px}
.filterbar input::placeholder{color:var(--mute)}
.filterbar select{flex:0 1 200px;background:var(--panel);border:1px solid var(--line);color:var(--white);padding:11px 12px;border-radius:6px;font-family:'IBM Plex Mono',monospace;font-size:12px}
.emptystate{padding:30px 4px;color:var(--mute);font-family:'IBM Plex Mono',monospace;font-size:13px;display:none}
.squadgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.squadcard{background:var(--panel);padding:15px;display:block;transition:background .12s}
.squadcard:hover{background:var(--panel2)}
.squadcard .pos{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.12em;color:var(--yellow)}
.squadcard .who{font-weight:600;font-size:16px;margin-top:5px}
.squadcard .cl{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--mute);margin-top:3px}
.squadcard .caps{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--teal);margin-top:9px}
.clubgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.clubcard{background:var(--panel);padding:16px;display:block;transition:background .12s}
.clubcard:hover{background:var(--panel2)}
.clubcard .cn{font-weight:600;font-size:16px}
.clubcard .cl2{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--mute);margin-top:4px}
.clubcard .cc{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--teal);margin-top:10px}
.fxlist{border:1px solid var(--line);border-radius:6px;overflow:hidden}
.fxrow{display:grid;grid-template-columns:78px 1fr auto auto auto;gap:12px;align-items:center;padding:11px 14px;background:var(--panel);border-bottom:1px solid var(--line);font-size:14px}
.fxrow:last-child{border-bottom:0}
a.fxrow.lnk:hover{background:var(--panel2)}
.fxd{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--mute)}
.fxo{font-weight:500}
.fxo .cl{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--mute)}
.fxv{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--mute)}
.ha{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--yellow);border:1px solid var(--line);padding:1px 5px;border-radius:3px;margin-left:4px}
.fxc{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--mute);text-align:right}
.fxs{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:13px}
.fxev{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--teal)}
.fxm{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--mute);text-align:right;min-width:38px}
.pdhead{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;flex-wrap:wrap;padding:14px 0 6px}
.pdname{font-size:clamp(26px,4.5vw,42px);font-weight:700;letter-spacing:-.01em}
.pdmeta{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--mute);margin-top:8px;letter-spacing:.04em}
.pdmeta a{color:var(--teal)}
.pdmeta b{color:var(--teal);font-weight:500}
.pdborn{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--mute);margin-top:6px}
.pdbadge{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding:6px 12px;border-radius:20px;border:1px solid var(--line);color:var(--mute);white-space:nowrap}
.pdstats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.pds{background:var(--panel);padding:15px 14px}
.pds .n{font-family:'IBM Plex Mono',monospace;font-size:21px;font-weight:600}
.pds .l{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin-top:5px}
.intlblock{border:1px solid var(--line);border-radius:6px;padding:14px 16px;margin-bottom:10px;background:var(--panel)}
.ilvl{font-weight:600;font-size:15px}
.ilvl span{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--mute);font-weight:400;margin-left:8px}
.isub{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin:14px 0 7px}
.intlblock .fxlist{border-color:#1F2627}
.intlblock .fxrow{background:var(--bg)}
.eliglist{display:flex;gap:8px;flex-wrap:wrap}
.elig{border:1px solid var(--line);border-radius:6px;padding:11px 14px;background:var(--panel);min-width:170px}
.elig .ec{display:block;font-weight:600;font-size:15px}
.elig .en{display:block;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;margin-top:4px}
.elig.tied .ec{color:var(--teal)}
.elig.tied .en{color:var(--teal)}
.elig.open .en{color:var(--yellow)}
.elig.blocked{opacity:.38}
.elig.blocked .en{color:var(--mute);text-decoration:line-through}
.eligNote{color:var(--mute);font-size:13px;margin-top:12px;max-width:70ch;font-family:'IBM Plex Mono',monospace;line-height:1.7}
.tlist{border:1px solid var(--line);border-radius:6px;overflow:hidden}
.trow{display:grid;grid-template-columns:60px 1fr auto;gap:12px;padding:11px 14px;background:var(--panel);border-bottom:1px solid var(--line);font-size:14px}
.trow:last-child{border-bottom:0}
.ty{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--mute)}
.tfee{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--teal)}
.msgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.mscard{background:var(--panel);padding:15px;display:block;transition:background .12s}
.mscard:hover{background:var(--panel2)}
.mstag{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--yellow)}
.msn{font-weight:600;font-size:16px;margin-top:6px}
.msd{color:var(--mute);font-size:13px;margin-top:5px}
.msc{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--teal);margin-top:9px}
.tabbar{display:flex;gap:6px;flex-wrap:wrap;margin:22px 0 4px}
.tab{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--line);border-radius:20px;padding:8px 16px;color:var(--mute);background:var(--panel)}
.tab:hover{color:var(--white)}
.tab.on{background:var(--yellow);color:#0C0F10;border-color:var(--yellow)}
.tabpanel{display:none}
.tabpanel.on{display:block}
.cmpgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.cmphead{background:var(--panel2);padding:14px;font-weight:700;font-size:15px}
.cmpk{background:var(--panel);padding:12px 14px;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.cmpv{background:var(--panel);padding:12px 14px;font-family:'IBM Plex Mono',monospace;font-size:14px}
.cmpv.win{color:var(--teal);font-weight:600}
footer{margin-top:60px;border-top:1px solid var(--line);padding:20px 0 44px;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);line-height:2}

/* ============ RESPONSIVE ============ */
html{-webkit-text-size-adjust:100%}
body{overflow-x:hidden}
img,svg,iframe{max-width:100%}
.burger{display:none;width:44px;height:44px;border:1px solid var(--line);border-radius:6px;padding:0;position:relative;flex:none}
.burger span{display:block;position:absolute;left:12px;width:20px;height:2px;background:var(--white);transition:transform .2s,opacity .2s}
.burger span:nth-child(1){top:15px}
.burger span:nth-child(2){top:21px}
.burger span:nth-child(3){top:27px}
.burger.x span:nth-child(1){transform:translateY(6px) rotate(45deg)}
.burger.x span:nth-child(2){opacity:0}
.burger.x span:nth-child(3){transform:translateY(-6px) rotate(-45deg)}

@media(hover:none){
  a,button,select,input{-webkit-tap-highlight-color:rgba(245,197,24,.18)}
  .plrow,.gicard,.squadcard,.clubcard,.mscard,a.fxrow{min-height:52px}
}

/* ---- tablet ---- */
@media(max-width:900px){
  .wrap{padding:0 16px}
  .navlinks{gap:14px;font-size:10px}
  .pdstats{grid-template-columns:repeat(4,1fr)}
}

/* ---- phone ---- */
@media(max-width:700px){
  .wrap{padding:0 14px}

  /* nav becomes a drawer */
  nav{padding:14px 0;flex-wrap:nowrap;gap:10px}
  .mark{font-size:17px;flex:1}
  .burger{display:block}
  .navmeta{display:none}
  .navlinks{
    display:none;position:absolute;left:0;right:0;top:100%;z-index:60;
    flex-direction:column;gap:0;background:var(--panel);
    border-top:1px solid var(--line);border-bottom:1px solid var(--line);
  }
  nav{position:relative}
  .navlinks.open{display:flex}
  .navlinks a{
    padding:15px 16px;border-bottom:1px solid var(--line);border-left:2px solid transparent;
    font-size:12px;letter-spacing:.12em;
  }
  .navlinks a:last-child{border-bottom:0}
  .navlinks a.on{border-left-color:var(--yellow);border-bottom-color:var(--line);background:var(--panel2)}

  /* headings */
  .pagehead{padding:24px 0 4px}
  .pagehead h1{font-size:26px}
  .pagehead p{font-size:14px}
  .sec{margin:28px 0 12px}
  .sec h2{font-size:11px;letter-spacing:.14em}

  /* carousel */
  .carousel{min-height:0}
  .slide{padding:20px 18px 46px}
  .slide h3{font-size:20px;line-height:1.2}
  .slide p{font-size:13px}
  .dots{bottom:14px;right:16px}

  /* horizontal strips get edge-to-edge scroll */
  .giband{border-radius:0;border-left:0;border-right:0;margin:0 -14px;scroll-snap-type:x mandatory}
  .gicard{flex:0 0 76vw;max-width:280px;scroll-snap-align:start}

  /* player rows */
  .plrow{grid-template-columns:1fr auto;gap:10px;padding:13px 2px}
  .plrow .nm{font-size:15px;line-height:1.25}
  .plrow .cl{display:block;margin-top:2px}
  .plrow .mn{display:none}

  /* fixtures & results: drop the trailing competition column, keep the numbers */
  .fxlist{border-radius:6px}
  .fxrow{grid-template-columns:58px 1fr auto;gap:10px;padding:12px;font-size:14px}
  .fxc{display:none}
  .fxv{font-size:12px}
  .fxs,.fxev{font-size:13px}
  .fxm{min-width:32px;font-size:11px}

  /* player header */
  .pdhead{padding:10px 0 4px;gap:12px}
  .pdname{font-size:28px;line-height:1.05}
  .pdmeta{font-size:11px;line-height:1.7}
  .pdbadge{font-size:10px;padding:5px 10px}
  .pdstats{grid-template-columns:repeat(2,1fr)}
  .pds{padding:13px 12px}
  .pds .n{font-size:19px}

  /* grids collapse to single column */
  .squadgrid,.clubgrid,.msgrid{grid-template-columns:1fr}
  .squadcard,.clubcard,.mscard{padding:14px}

  /* filters stack full width and stay tappable */
  .filterbar{gap:8px;margin:16px 0 20px}
  .filterbar input,.filterbar select{flex:1 1 100%;min-height:46px;font-size:16px}

  /* international blocks */
  .intlblock{padding:12px 13px}
  .ilvl{font-size:14px}
  .ilvl span{display:block;margin-left:0;margin-top:4px}

  /* eligibility cards full width */
  .eliglist{flex-direction:column}
  .elig{min-width:0;width:100%}
  .eligNote{font-size:12px;line-height:1.65}

  /* transfers */
  .trow{grid-template-columns:50px 1fr;gap:8px;padding:12px;font-size:13px}
  .tfee{grid-column:2;font-size:11px}

  /* tabs scroll horizontally rather than wrapping into a block */
  .tabbar{flex-wrap:nowrap;overflow-x:auto;margin:16px -14px 4px;padding:0 14px 4px;scrollbar-width:none}
  .tabbar::-webkit-scrollbar{display:none}
  .tab{flex:none;padding:9px 15px;font-size:11px}

  /* compare stays 3 columns — stacking loses the comparison */
  .cmpgrid{grid-template-columns:1.1fr 1fr 1fr}
  .cmphead{padding:11px 9px;font-size:13px}
  .cmpk{padding:10px 9px;font-size:9px;letter-spacing:.04em}
  .cmpv{padding:10px 9px;font-size:12px}

  footer{margin-top:40px;padding:18px 0 36px;font-size:9px}
}

/* ---- small phone ---- */
@media(max-width:380px){
  .pagehead h1{font-size:23px}
  .pdname{font-size:24px}
  .pdstats{grid-template-columns:repeat(2,1fr)}
  .gicard{flex:0 0 84vw}
  .cmpgrid{grid-template-columns:1fr 1fr 1fr}
  .cmpk{font-size:8px}
}

/* notch / home-indicator safe areas */
@supports(padding:max(0px)){
  .wrap{padding-left:max(14px,env(safe-area-inset-left));padding-right:max(14px,env(safe-area-inset-right))}
  footer{padding-bottom:max(36px,env(safe-area-inset-bottom))}
}
</style>
</head>

<nav>
